<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劇場公演 データサイト</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 75px; }
    .avatar-box {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .member-first { color: #db2777; font-weight: 700; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; display: inline-block; padding: 0.125rem 0; }
    .member-first:hover { opacity: 0.7; }
    .member-under { color: #b45309; font-weight: 700; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; display: inline-block; padding: 0.125rem 0; }
    .member-under:hover { opacity: 0.7; }

    /* カレンダーグリッド用スタイル */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      background-color: #e2e8f0;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .cal-cell {
      background-color: #ffffff;
      min-height: 70px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    .cal-cell.other-month { background-color: #f8fafc; color: #94a3b8; }
    .cal-cell.today { background-color: #fdf2f8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" onclick="goHome()">
        <i class="fa-solid fa-masks-theater"></i> 劇場公演 データサイト
      </h1>
    </div>

    <!-- 検索バー ＆ サジェスト -->
    <div class="max-w-4xl mx-auto mt-3 relative">
      <div class="relative">
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="演目名 または メンバー名で検索" 
               class="w-full pl-9 pr-4 py-2 bg-white text-slate-800 text-sm rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-pink-300">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>
      <div id="searchSuggest" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-72 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4">

    <!-- 通常タブコンテンツ -->
    <div id="mainTabsContainer">
      <!-- Tab 1: カレンダー -->
      <section id="tab-calendar" class="tab-content">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
            <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
              <i class="fa-regular fa-calendar-days text-pink-500"></i> スケジュール
            </h2>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
              <!-- ビュー切り替えボタン -->
              <div class="bg-slate-100 p-0.5 rounded-lg border border-slate-200 flex text-xs">
                <button id="viewListBtn" onclick="toggleCalendarView('list')" class="px-2.5 py-1 rounded-md font-bold transition bg-white text-pink-600 shadow-sm">
                  <i class="fa-solid fa-list mr-1"></i> リスト
                </button>
                <button id="viewGridBtn" onclick="toggleCalendarView('grid')" class="px-2.5 py-1 rounded-md font-bold transition text-slate-600 hover:text-pink-600">
                  <i class="fa-solid fa-calendar-grid mr-1"></i> 月間
                </button>
              </div>

              <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-lg border border-slate-200">
                <button onclick="changeMonth(-1)" class="p-1.5 text-slate-400 hover:text-pink-600 rounded hover:bg-slate-200"><i class="fa-solid fa-chevron-left"></i></button>
                <select id="yearSelect" onchange="onDateChange()" class="bg-transparent text-slate-700 text-sm font-bold px-1 py-1 focus:outline-none cursor-pointer"></select>
                <select id="monthSelect" onchange="onDateChange()" class="bg-transparent text-slate-700 text-sm font-bold px-1 py-1 focus:outline-none cursor-pointer"></select>
                <button onclick="changeMonth(1)" class="p-1.5 text-slate-400 hover:text-pink-600 rounded hover:bg-slate-200"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>
          </div>

          <!-- 劇場選択タブ -->
          <div class="flex flex-nowrap overflow-x-auto gap-1.5 mb-4 pb-2">
            <button onclick="filterSchedule('ALL', this)" class="filter-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">全劇場</button>
            <button onclick="filterSchedule('AKB48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">AKB48劇場</button>
            <button onclick="filterSchedule('SKE48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">SKE48劇場</button>
            <button onclick="filterSchedule('NMB48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">NMB48劇場</button>
            <button onclick="filterSchedule('HKT48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">HKT48劇場</button>
            <button onclick="filterSchedule('NGT48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">NGT48劇場</button>
            <button onclick="filterSchedule('STU48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">STU48劇場</button>
          </div>
          
          <div id="calendarList" class="space-y-3"></div>
          <div id="calendarGrid" class="hidden"></div>
        </div>
      </section>

      <!-- Tab 2: 一覧表 -->
      <section id="tab-positions" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <h2 id="posStageTitle" class="text-lg font-bold text-slate-800 mb-4">公演名</h2>
          <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-inner">
            <table class="w-full text-left text-sm border-collapse min-w-max">
              <thead><tr id="positionTableHeader" class="bg-slate-50 border-b border-slate-200"></tr></thead>
              <tbody id="positionTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Tab 3: 日別表 -->
      <section id="tab-stage-daily" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-table-cells text-pink-500"></i> 日別表
          </h2>
          <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-inner">
            <table class="w-full text-left text-sm border-collapse min-w-max">
              <thead><tr id="dailyTableHeader" class="bg-slate-50 border-b border-slate-200"></tr></thead>
              <tbody id="dailyTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Tab 4: 予想 -->
      <section id="tab-forecast" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-4">
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-pink-500"></i> ポジション予想
          </h2>
          <div class="space-y-2">
            <label class="block text-xs font-bold text-slate-600">出演メンバー（スペースや・などで区切るか、羅列してください）</label>
            <textarea id="forecastInputText" rows="3" placeholder="例: 小栗有以・倉野尾成美・佐藤綺星・下尾みう・鈴木くるみ・千葉恵里・永野芹佳・水島美結・向井地美音・村山彩希・山内瑞葵・山﨑空・秋山由奈・八木愛月..." class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-300"></textarea>
            <button onclick="runForecast()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg text-sm shadow transition">
              予想を実行する
            </button>
          </div>

          <!-- 予想結果表示エリア -->
          <div id="forecastResultArea" class="hidden space-y-4 pt-2 border-t border-slate-100">
            <div>
              <h3 class="text-xs font-bold text-slate-500 mb-2">【全メンバー一覧（出演マーク付き）】</h3>
              <div id="forecastAllMembersGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-xs"></div>
            </div>

            <div>
              <h3 class="text-xs font-bold text-slate-500 mb-2">【ポジション別自動割り当て ＆ 予想理由】</h3>
              <div id="forecastPositionsList" class="space-y-3"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- メンバー詳細コンテンツ -->
    <section id="memberDetailContainer" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="avatar-box bg-pink-600 text-white text-base font-bold shadow">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <h2 id="detailMemberName" class="text-xl font-bold text-slate-800">メンバー名</h2>
            <p class="text-xs text-pink-600 font-semibold">出演データ統計</p>
          </div>
        </div>
        <button onclick="goHome()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold border border-slate-200">
          <i class="fa-solid fa-xmark mr-1"></i> 閉じる
        </button>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-pink-500"></i> 出演統計
          </h3>
          <span id="totalPerfBadge" class="bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full">総出演回数: 0回</span>
        </div>
        <h4 class="text-xs font-bold text-slate-500 mb-2">演目ごとの出演回数</h4>
        <ul id="showsBreakdownList" class="space-y-1.5 text-xs"></ul>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-pink-500"></i> 出演履歴
        </h3>
        <div id="memberShowsHistoryList" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
      </div>
    </section>

  </main>

  <!-- スケジュール詳細ポップアップ モーダル -->
  <div id="scheduleModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-4 shadow-2xl border border-slate-100 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <span id="modalTheater" class="text-[10px] font-bold px-2 py-0.5 rounded bg-pink-100 text-pink-700"></span>
          <h3 id="modalTitle" class="text-base font-bold text-slate-800 mt-1"></h3>
          <p id="modalDate" class="text-xs text-slate-500 font-medium"></p>
        </div>
        <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="modalMembersArea" class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs space-y-2">
        <div class="font-bold text-slate-700 flex justify-between items-center">
          <span>【出演メンバー / ポジション】</span>
          <span id="modalPosCount" class="text-[10px] text-pink-600 bg-pink-50 px-1.5 py-0.5 rounded border border-pink-200"></span>
        </div>
        <div id="modalMemberList" class="grid grid-cols-2 gap-1.5 pt-1"></div>
      </div>

      <div class="flex gap-2 pt-2">
        <button id="modalBtnGoStage" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-3 rounded-lg text-xs shadow transition text-center">
          演目詳細を開く
        </button>
        <button onclick="closeScheduleModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-3 rounded-lg text-xs transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
    <div id="navNormal" class="max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn active flex-1 py-3 text-center text-xs font-semibold text-pink-600">
        <i class="fa-regular fa-calendar-days text-base block mb-0.5"></i> カレンダー
      </button>
    </div>

    <div id="navStageDetail" class="hidden max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('positions')" id="nav-positions" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-users-rectangle text-base block mb-0.5"></i> 一覧表
      </button>
      <button onclick="switchTab('stage-daily')" id="nav-stage-daily" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-table-cells text-base block mb-0.5"></i> 日別表
      </button>
      <button onclick="switchTab('forecast')" id="nav-forecast" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-wand-magic-sparkles text-base block mb-0.5"></i> 予想
      </button>
      <button onclick="goHome()" id="nav-back" class="flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-rotate-left text-base block mb-0.5"></i> 戻る
      </button>
    </div>

    <div id="navMemberSearching" class="hidden max-w-4xl mx-auto flex justify-center py-3 bg-pink-50 text-pink-600 font-bold text-sm items-center gap-2 border-t-2 border-pink-500">
      <i class="fa-solid fa-user-gear"></i>
      <span>メンバー詳細表示中</span>
      <button onclick="goHome()" class="text-xs bg-pink-600 text-white px-3 py-1 rounded ml-2 shadow-sm">戻る</button>
    </div>
  </nav>

  <!-- JavaScript Logic -->
  <script>
    const MASTER_MEMBER_ORDER = [
      "秋山由奈", "新井彩永", "伊藤百花", "岩立沙穂", "太田有紀", "奥本カイリ", "小栗有以", "川村結衣", "行天優莉奈", "工藤華純", 
      "久保姫菜乃", "倉野尾成美", "黒須遥香", "坂川陽香", "迫由芽実", "佐藤綺星", "下尾みう", "髙橋彩音", "千葉恵里", "徳永羚海", 
      "長友彩海", "永野芹佳", "成田香姫奈", "橋本恵理子", "橋本陽菜", "畠山希美", "平田侑希", "福岡聖菜", "布袋百椛", "正鋳真優", 
      "水島美結", "武藤小麟", "八木愛月", "山内瑞葵", "山口結愛", "山﨑空", "山根涼羽", "大賀彩姫", "近藤沙樹", "丸山ひなた", 
      "髙橋舞桜", "田中沙友利", "牧戸愛茉", "森川優", "渡邉葵心", "大西ゆな", "長谷川百々花", "前田衣澄", "山内利乃明"
    ];

    let SCHEDULE_DATA = [];
    let ALL_SCHEDULE_DATA = []; 
    let GLOBAL_STAGE_DATABASE = {}; 
    let STAGE_DATABASE = {};
    let currentStageKey = null;
    let currentScheduleFilter = "ALL";
    let selectedMemberName = null;
    let todayString = "";
    let calendarViewMode = 'list'; // 'list' or 'grid'

    const FALLBACK_SCHEDULE_2026 = [
      {
        "id": "akb_260807",
        "date": "2026-08-07 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演 初日",
        "members": ["新井彩永", "久保姫菜乃", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛", "山﨑空"],
        "positions": ["新井彩永", "久保姫菜乃", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛", "山﨑空"]
      },
      {
        "id": "akb_260826",
        "date": "2026-08-26 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演",
        "members": ["秋山由奈", "奥本カイリ", "下尾みう", "成田香姫奈", "福岡聖菜", "正鋳真優", "近藤沙樹", "田中沙友利"],
        "positions": ["福岡聖菜", "秋山由奈", "成田香姫奈", "奥本カイリ", "田中沙友利", "正鋳真優", "下尾みう", "近藤沙樹"]
      },
      {
        "id": "akb_260831",
        "date": "2026-08-31 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演",
        "members": ["太田有紀", "工藤華純", "黒須遥香", "迫由芽実", "佐藤綺星", "成田香姫奈", "福岡聖菜", "山内瑞葵"],
        "positions": ["福岡聖菜", "佐藤綺星", "成田香姫奈", "迫由芽実", "太田有紀", "山内瑞葵", "黒須遥香", "工藤華純"]
      }
    ];

    document.addEventListener("DOMContentLoaded", async () => {
      initYearMonthDropdowns();
      await loadAllYearsScheduleData(); 
      await onDateChange();

      document.addEventListener('click', (e) => {
        const suggestBox = document.getElementById('searchSuggest');
        const searchInput = document.getElementById('searchInput');
        if (suggestBox && !suggestBox.contains(e.target) && e.target !== searchInput) suggestBox.classList.add('hidden');
      });
    });

    function initYearMonthDropdowns() {
      const yearSelect = document.getElementById("yearSelect");
      const monthSelect = document.getElementById("monthSelect");
      yearSelect.innerHTML = ''; monthSelect.innerHTML = '';
      for (let y = 2026; y >= 2005; y--) yearSelect.appendChild(new Option(`${y}年`, y));
      for (let m = 1; m <= 12; m++) monthSelect.appendChild(new Option(`${m}月`, m < 10 ? `0${m}` : `${m}`));
      
      const now = new Date();
      yearSelect.value = now.getFullYear();
      monthSelect.value = (now.getMonth() + 1).toString().padStart(2, '0');
      
      const yStr = now.getFullYear();
      const mStr = (now.getMonth() + 1).toString().padStart(2, '0');
      const dStr = now.getDate().toString().padStart(2, '0');
      todayString = `${yStr}/${mStr}/${dStr}`;
    }

    function changeMonth(diff) {
      const yearSelect = document.getElementById("yearSelect");
      const monthSelect = document.getElementById("monthSelect");
      let y = parseInt(yearSelect.value, 10);
      let m = parseInt(monthSelect.value, 10);
      m += diff;
      if (m > 12) { m = 1; y++; }
      else if (m < 1) { m = 12; y--; }
      yearSelect.value = y.toString();
      monthSelect.value = (m < 10 ? "0" : "") + m;
      onDateChange();
    }

    async function fetchScheduleJson(groupName, year) {
      const fileName = `schedule_${groupName.toLowerCase()}_${year}.json`;
      try {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error("JSON not found");
        return await response.json();
      } catch (err) {
        return year == 2026 ? FALLBACK_SCHEDULE_2026 : [];
      }
    }

    async function loadAllYearsScheduleData() {
      let allList = [];
      const currentYear = new Date().getFullYear();
      const promises = [];
      
      for (let y = 2020; y <= currentYear; y++) {
        promises.push(fetchScheduleJson("akb48", y));
      }
      
      const results = await Promise.all(promises);
      results.forEach(rawData => {
        if (Array.isArray(rawData)) {
          allList = allList.concat(normalizeScheduleData(rawData));
        }
      });
      ALL_SCHEDULE_DATA = allList;
      generateGlobalStageDatabase(); 
    }

    function normalizeScheduleData(rawData) {
      return rawData.map(item => {
        let rawDateStr = item.date || "";
        let datePart = "", timePart = item.time || "";

        if (rawDateStr.includes(" ")) {
          const parts = rawDateStr.split(" ");
          datePart = parts[0].replace(/-/g, "/");
          timePart = timePart || parts[1];
        } else {
          datePart = rawDateStr.replace(/-/g, "/");
        }

        let rawTitle = item.title || item.stage || "";
        let mainTitle = rawTitle;
        let subTitle = item.event || item.subTitle || "";

        if (!subTitle) {
          const match = rawTitle.match(/^(「.*?」公演)(?:\s+(.*))?$/);
          if (match) {
            mainTitle = match[1];
            subTitle = match[2] || "";
          }
        }

        let baseStage = mainTitle.replace(/「|」|『|』/g, '').replace(/公演.*$/, '').trim();

        let membersArr = [];
        let performersStr = "";
        if (Array.isArray(item.members)) {
          membersArr = item.members.filter(m => m && m !== "-" && m !== "－");
          performersStr = membersArr.join("・");
        }

        let posArr = Array.isArray(item.positions) ? item.positions : [];

        return {
          id: item.id || `evt_${Math.random().toString(36).substring(2, 9)}`,
          date: datePart,
          time: timePart,
          theater: item.theater || "AKB48劇場",
          displayTitle: mainTitle,
          subTitle: subTitle,
          baseStageName: baseStage,
          performersText: performersStr,
          membersArray: membersArr,
          positionsArray: posArr
        };
      });
    }

    function generateGlobalStageDatabase() {
      GLOBAL_STAGE_DATABASE = {};
      ALL_SCHEDULE_DATA.forEach(item => {
        const base = item.baseStageName;
        if (!base) return;

        if (!GLOBAL_STAGE_DATABASE[base]) {
          GLOBAL_STAGE_DATABASE[base] = {
            id: base,
            name: `「${base}」公演`,
            group: item.theater.replace("劇場", "").trim() || "AKB48",
            fixed: [],
            allMembers: new Set(),
            schedules: []
          };
        }
        GLOBAL_STAGE_DATABASE[base].schedules.push(item);
        item.membersArray.forEach(m => { 
          if(m && m !== "-" && m !== "－") GLOBAL_STAGE_DATABASE[base].allMembers.add(m.trim()); 
        });
      });

      Object.keys(GLOBAL_STAGE_DATABASE).forEach(key => {
        const stage = GLOBAL_STAGE_DATABASE[key];
        stage.schedules.sort((a, b) => (a.date + " " + a.time).localeCompare(b.date + " " + b.time));
        const firstShow = stage.schedules.find(s => s.positionsArray && s.positionsArray.length > 0);
        if (firstShow) {
          stage.fixed = firstShow.positionsArray.map(m => (m === "-" || m === "－") ? "" : m);
        }
        const rawMembersSet = stage.allMembers;
        stage.allMembers = MASTER_MEMBER_ORDER.filter(m => rawMembersSet.has(m) || MASTER_MEMBER_ORDER.includes(m));
      });
    }

    function generateStageDatabase() {
      STAGE_DATABASE = {};
      SCHEDULE_DATA.forEach(item => {
        const base = item.baseStageName;
        if (!base) return;

        if (!STAGE_DATABASE[base]) {
          STAGE_DATABASE[base] = {
            id: base,
            name: `「${base}」公演`,
            group: item.theater.replace("劇場", "").trim() || "AKB48",
            fixed: [],
            allMembers: new Set(),
            schedules: []
          };
        }
        STAGE_DATABASE[base].schedules.push(item);
        item.membersArray.forEach(m => { 
          if(m && m !== "-" && m !== "－") STAGE_DATABASE[base].allMembers.add(m.trim()); 
        });
      });

      Object.keys(STAGE_DATABASE).forEach(key => {
        const stage = STAGE_DATABASE[key];
        stage.schedules.sort((a, b) => (a.date + " " + a.time).localeCompare(b.date + " " + b.time));
        
        if (GLOBAL_STAGE_DATABASE[key] && GLOBAL_STAGE_DATABASE[key].fixed.length > 0) {
          stage.fixed = GLOBAL_STAGE_DATABASE[key].fixed;
        } else {
          const firstShow = stage.schedules.find(s => s.positionsArray && s.positionsArray.length > 0);
          if (firstShow) {
            stage.fixed = firstShow.positionsArray.map(m => (m === "-" || m === "－") ? "" : m);
          }
        }
        
        const rawMembersSet = stage.allMembers;
        stage.allMembers = MASTER_MEMBER_ORDER.filter(m => rawMembersSet.has(m) || MASTER_MEMBER_ORDER.includes(m));
      });
    }

    function getAllUniqueMembers() {
      const set = new Set(MASTER_MEMBER_ORDER);
      const dataSource = ALL_SCHEDULE_DATA.length > 0 ? ALL_SCHEDULE_DATA : SCHEDULE_DATA;
      dataSource.forEach(item => {
        if (item.membersArray) {
          item.membersArray.forEach(m => { if (m && m !== "-" && m !== "－") set.add(m.trim()); });
        }
        if (item.positionsArray) {
          item.positionsArray.forEach(m => { if (m && m !== "-" && m !== "－") set.add(m.trim()); });
        }
      });
      return Array.from(set);
    }

    function renderCalendarGrid() {
      const gridContainer = document.getElementById('calendarGrid');
      gridContainer.innerHTML = '';

      const year = parseInt(document.getElementById("yearSelect").value, 10);
      const month = parseInt(document.getElementById("monthSelect").value, 10);

      const firstDay = new Date(year, month - 1, 1);
      const lastDay = new Date(year, month, 0);
      const startDayOfWeek = firstDay.getDay(); 
      const totalDays = lastDay.getDate();

      const filtered = getFilteredSchedules();
      const schedMap = {};
      filtered.forEach(item => {
        const dStr = item.date;
        if (!schedMap[dStr]) schedMap[dStr] = [];
        schedMap[dStr].push(item);
      });

      let html = `<div class="cal-grid">`;
      const dayLabels = ['日', '月', '火', '水', '木', '金', '土'];
      
      dayLabels.forEach((label, i) => {
        const color = i === 0 ? 'text-red-500' : (i === 6 ? 'text-blue-500' : 'text-slate-600');
        html += `<div class="bg-slate-100 p-1 text-center font-bold text-xs ${color}">${label}</div>`;
      });

      for (let i = 0; i < startDayOfWeek; i++) {
        html += `<div class="cal-cell other-month"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const mStr = month.toString().padStart(2, '0');
        const dStr = day.toString().padStart(2, '0');
        const fullDateStr = `${year}/${mStr}/${dStr}`;
        const isToday = fullDateStr === todayString;

        const dayShows = schedMap[fullDateStr] || [];

        html += `
          <div class="cal-cell ${isToday ? 'today border border-pink-400' : ''}">
            <span class="text-[10px] font-bold ${isToday ? 'text-pink-600' : 'text-slate-600'}">${day}</span>

            <div onclick="openScheduleModalById('${s.id}')" class="bg-pink-100 hover:bg-pink-200 text-pink-800 text-[9px] p-0.5 rounded leading-tight cursor-pointer truncate" title="${escapeHtml(s.displayTitle)}">
              ${s.time ? s.time + ' ' : ''}${escapeHtml(s.baseStageName)}
            </div>
          `;
        });

        html += `</div></div>`;
      }

      const totalCells = startDayOfWeek + totalDays;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      for (let i = 0; i < remainingCells; i++) {
        html += `<div class="cal-cell other-month"></div>`;
      }

      html += `</div>`;
      gridContainer.innerHTML = html;
    }

    function getOrderedUnderList(pIdx, fixedMember, validShows, inputMemberList = []) {
      const experiencedSet = new Set();

      validShows.forEach(show => {
        if (show.positionsArray && show.positionsArray[pIdx]) {
          const m = show.positionsArray[pIdx].trim();
          if (m && m !== "-" && m !== "－" && m !== fixedMember) {
            experiencedSet.add(m);
          }
        }
      });

      const masterList = MASTER_MEMBER_ORDER.filter(m => experiencedSet.has(m));

      if (inputMemberList && inputMemberList.length > 0) {
        inputMemberList.forEach(m => {
          if (experiencedSet.has(m) && !MASTER_MEMBER_ORDER.includes(m) && !masterList.includes(m)) {
            masterList.push(m);
          }
        });
      }

      return masterList;
    }

    function formatUndersText(absentUnders) {
      if (!absentUnders || absentUnders.length === 0) return "";
      if (absentUnders.length === 1) return absentUnders[0];
      if (absentUnders.length === 2) return `${absentUnders[0]}や${absentUnders[1]}`;
      return `${absentUnders[0]}や${absentUnders[1]}など`;
    }

    function getCoopProbability(m1, m2, pIdx1, pIdx2, validShows) {
      let countDefault = 0;
      let countSwapped = 0;

      validShows.forEach(show => {
        const pos = show.positionsArray;
        if (pos && pos.includes(m1) && pos.includes(m2)) {
          if (pos[pIdx1] === m1 && pos[pIdx2] === m2) {
            countDefault++;
          } else if (pos[pIdx1] === m2 && pos[pIdx2] === m1) {
            countSwapped++;
          }
        }
      });

      const total = countDefault + countSwapped;
      if (total === 0) {
        return { p1: 50, p2: 50, total: 0, countDefault: 0, countSwapped: 0 };
      }

      const rawP1 = Math.round((countDefault / total) * 100);
      const rawP2 = 100 - rawP1;

      return {
        p1: rawP1,
        p2: rawP2,
        total: total,
        countDefault: countDefault,
        countSwapped: countSwapped
      };
    }

    function hungarianMaxWeight(costMatrix) {
      const rows = costMatrix.length;
      if (rows === 0) return {};
      const cols = costMatrix[0].length;
      const n = Math.max(rows, cols);

      let maxVal = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (costMatrix[r][c] > maxVal) maxVal = costMatrix[r][c];
        }
      }

      const a = Array.from({ length: n }, () => new Array(n).fill(maxVal));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          a[r][c] = maxVal - costMatrix[r][c];
        }
      }

      const u = new Array(n + 1).fill(0);
      const v = new Array(n + 1).fill(0);
      const p = new Array(n + 1).fill(0);
      const way = new Array(n + 1).fill(0);

      for (let i = 1; i <= n; i++) {
        p[0] = i;
        let j0 = 0;
        const minv = new Array(n + 1).fill(Infinity);
        const used = new Array(n + 1).fill(false);

        do {
          used[j0] = true;
          const i0 = p[j0];
          let delta = Infinity;
          let j1 = 0;

          for (let j = 1; j <= n; j++) {
            if (!used[j]) {
              const cur = a[i0 - 1][j - 1] - u[i0] - v[j];
              if (cur < minv[j]) {
                minv[j] = cur;
                way[j] = j0;
              }
              if (minv[j] < delta) {
                delta = minv[j];
                j1 = j;
              }
            }
          }

          for (let j = 0; j <= n; j++) {
            if (used[j]) {
              u[p[j]] += delta;
              v[j] -= delta;
            } else {
              minv[j] -= delta;
            }
          }
          j0 = j1;
        } while (p[j0] !== 0);

        do {
          const j1 = way[j0];
          p[j0] = p[j1];
          j0 = j1;
        } while (j0 !== 0);
      }

      const result = {};
      for (let j = 1; j <= n; j++) {
        const r = p[j] - 1;
        const c = j - 1;
        if (r < rows && c < cols) {
          result[r] = c;
        }
      }
      return result;
    }

    function getAllOptimalAssignments(inputMemberList, stageFixed, validShows) {
      const numPos = stageFixed.length;
      const numMembers = inputMemberList.length;
      if (numMembers === 0 || numPos === 0) return { bestMapping: {}, candidatesArrayMap: {} };

      const costMatrix = Array.from({ length: numMembers }, () => new Array(numPos).fill(0));
      const inputSet = new Set(inputMemberList);

      inputMemberList.forEach((m, mIdx) => {
        for (let pIdx = 0; pIdx < numPos; pIdx++) {
          let score = 0;
          const targetFixed = stageFixed[pIdx];

          let totalPerfAtPos = 0;
          let coStarPerfAtPos = 0;

          validShows.forEach(show => {
            const pos = show.positionsArray;
            if (pos && pos[pIdx] === m) {
              totalPerfAtPos++;
              let hasCoStar = false;
              pos.forEach((otherM) => {
                if (otherM !== m && inputSet.has(otherM)) {
                  hasCoStar = true;
                }
              });
              if (hasCoStar) coStarPerfAtPos++;
            }
          });

          const isExperiencedAtPos = (totalPerfAtPos > 0 || targetFixed === m);

          if (isExperiencedAtPos) {
            score += 10000000;
            if (targetFixed === m) score += 100000;
            score += totalPerfAtPos * 1000;
            score += coStarPerfAtPos * 100;
          }
          costMatrix[mIdx][pIdx] = score;
        }
      });

      const bestAssignmentMap = hungarianMaxWeight(costMatrix);
      const bestMapping = {};
      const assignedMembers = new Set();
      const assignedPositions = new Set();

      Object.entries(bestAssignmentMap).forEach(([mIdxStr, pIdx]) => {
        const mIdx = parseInt(mIdxStr, 10);
        if (mIdx < numMembers && pIdx < numPos) {
          const memberName = inputMemberList[mIdx];
          bestMapping[pIdx] = memberName;
          assignedMembers.add(memberName);
          assignedPositions.add(pIdx);
        }
      });

      const unassignedMembers = inputMemberList.filter(m => !assignedMembers.has(m));
      const unassignedPositions = [];
      for (let pIdx = 0; pIdx < numPos; pIdx++) {
        if (!assignedPositions.has(pIdx)) unassignedPositions.push(pIdx);
      }
      unassignedMembers.forEach((m, i) => {
        if (i < unassignedPositions.length) {
          bestMapping[unassignedPositions[i]] = m;
        }
      });

      const posExperiencedMembers = {};
      for (let pIdx = 0; pIdx < numPos; pIdx++) {
        posExperiencedMembers[pIdx] = [];
        inputMemberList.forEach(m => {
          const mIdx = inputMemberList.indexOf(m);
          if (costMatrix[mIdx][pIdx] >= 10000000) {
            posExperiencedMembers[pIdx].push(m);
          }
        });
      }

      const allPossibleCandidates = {};
      for (let pIdx = 0; pIdx < numPos; pIdx++) {
        allPossibleCandidates[pIdx] = new Set();
      }

      const maxCategoryAssignments = [];
      
      function backtrack(pIdx, usedMembers, currentMap) {
        if (pIdx === numPos) {
          maxCategoryAssignments.push({...currentMap});
          return;
        }

        const exps = posExperiencedMembers[pIdx].filter(m => !usedMembers.has(m));
        if (exps.length > 0) {
          for (const m of exps) {
            usedMembers.add(m);
            currentMap[pIdx] = m;
            backtrack(pIdx + 1, usedMembers, currentMap);
            usedMembers.delete(m);
          }
        } else {
          const remainingMembers = inputMemberList.filter(m => !usedMembers.has(m));
          for (const m of remainingMembers) {
            usedMembers.add(m);
            currentMap[pIdx] = m;
            backtrack(pIdx + 1, usedMembers, currentMap);
            usedMembers.delete(m);
          }
        }
      }

      backtrack(0, new Set(), {});

      if (maxCategoryAssignments.length > 0) {
        maxCategoryAssignments.forEach(assign => {
          Object.entries(assign).forEach(([pIdxStr, m]) => {
            const pIdx = parseInt(pIdxStr, 10);
            allPossibleCandidates[pIdx].add(m);
          });
        });
      } else {
        Object.entries(bestMapping).forEach(([pIdxStr, m]) => {
          const pIdx = parseInt(pIdxStr, 10);
          allPossibleCandidates[pIdx].add(m);
        });
      }

      const candidatesArrayMap = {};
      for (let pIdx = 0; pIdx < numPos; pIdx++) {
        const candSet = allPossibleCandidates[pIdx];
        candidatesArrayMap[pIdx] = inputMemberList.filter(m => candSet.has(m));
      }

      return { bestMapping, candidatesArrayMap };
    }

    function runForecast() {
      const stage = GLOBAL_STAGE_DATABASE[currentStageKey] || STAGE_DATABASE[currentStageKey];
      if (!stage) {
        alert("先に公演を選択してください。");
        return;
      }

      const rawInput = document.getElementById('forecastInputText').value;
      const inputNames = rawInput.split(/[\s・,\n/]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0 && s !== "-" && s !== "－");

      const inputSet = new Set(inputNames);
      const inputMemberList = Array.from(inputSet);

      const resultArea = document.getElementById('forecastResultArea');
      const allMembersGrid = document.getElementById('forecastAllMembersGrid');
      const positionsList = document.getElementById('forecastPositionsList');
      resultArea.classList.remove('hidden');
      allMembersGrid.innerHTML = '';
      positionsList.innerHTML = '';

      const stageName = stage.name.replace(/「|」|公演/g, '').trim();

      MASTER_MEMBER_ORDER.forEach(name => {
        if (name === "-" || name === "－") return;
        const isAttending = inputSet.has(name);
        const div = document.createElement('div');
        div.className = `p-2 rounded border flex items-center justify-between ${isAttending ? 'bg-pink-50 border-pink-300 font-bold text-pink-700' : 'bg-white border-slate-200 text-slate-600'}`;
        div.innerHTML = `
          <span>${escapeHtml(name)}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded ${isAttending ? 'bg-pink-600 text-white' : 'bg-slate-100 text-slate-400'}">${isAttending ? '出演' : '不在'}</span>
        `;
        allMembersGrid.appendChild(div);
      });

      const validShows = stage.schedules.filter(s => s.positionsArray && s.positionsArray.length > 0);

      function getMemberStats(memberName) {
        let totalCount = 0;
        let posCountMap = {};
        let lastDateMap = {};
        if (!memberName || memberName === "-" || memberName === "－") {
          return { totalCount: 0, posCountMap: {}, lastDateMap: {}, uniquePositionsCount: 0 };
        }
        validShows.forEach(show => {
          show.positionsArray.forEach((m, pIdx) => {
            if (m === memberName) {
              totalCount++;
              const orig = stage.fixed[pIdx];
              if (orig && orig !== "-" && orig !== "－") {
                posCountMap[orig] = (posCountMap[orig] || 0) + 1;
                lastDateMap[orig] = show.date;
              }
            }
          });
        });
        return { totalCount, posCountMap, lastDateMap, uniquePositionsCount: Object.keys(posCountMap).length };
      }

      const { bestMapping, candidatesArrayMap } = getAllOptimalAssignments(inputMemberList, stage.fixed, validShows);
      const memberToPosMap = {};
      Object.entries(bestMapping).forEach(([pIdx, m]) => {
        memberToPosMap[m] = parseInt(pIdx, 10);
      });

      stage.fixed.forEach((fixedMember, pIdx) => {
        const cands = candidatesArrayMap[pIdx] || [];
        const assignedName = bestMapping[pIdx] || "未定";
        const isMultipleCandidates = cands.length > 1;

        const stats = getMemberStats(assignedName);
        const isExperienced = (stats.posCountMap[fixedMember] || 0) > 0 || assignedName === fixedMember;

        const orderedUnders = getOrderedUnderList(pIdx, fixedMember, validShows, inputMemberList);
        const absentUnders = orderedUnders.filter(u => !inputSet.has(u));
        const availableUnders = orderedUnders.filter(u => inputSet.has(u));

        let reasonHtml = "";
        let displayAssignedName = assignedName;

        if (isMultipleCandidates) {
          displayAssignedName = cands.join(" / ");

          const basePct = Math.floor(100 / cands.length);
          const pctListStr = cands.map((m, idx) => {
            const pVal = (idx === cands.length - 1) ? (100 - basePct * (cands.length - 1)) : basePct;
            return `${m} ${pVal}%`;
          }).join("、");

          const warningBadge = `<br><span class="text-xs text-pink-600 font-bold mt-1 inline-block">⚠︎ ${pctListStr}</span>`;

          const dupSourcePosIdxs = [];
          cands.forEach(m => {
            stage.fixed.forEach((fM, otherPIdx) => {
              if (otherPIdx !== pIdx) {
                const mStats = getMemberStats(m);
                if ((mStats.posCountMap[fM] || 0) > 0 || m === fM) {
                  if (!dupSourcePosIdxs.includes(otherPIdx)) dupSourcePosIdxs.push(otherPIdx);
                }
              }
            });
          });
          dupSourcePosIdxs.sort((a, b) => a - b);

          const candsTextOr = cands.join("か");
          const candsTextAnd = cands.length === 2 ? `${cands[0]}と${cands[1]}` : cands.join("や");

          const hasSelfExp = cands.some(m => (getMemberStats(m).posCountMap[fixedMember] || 0) > 0 || m === fixedMember);

          if (hasSelfExp) {
            const expCands = cands.filter(m => (getMemberStats(m).posCountMap[fixedMember] || 0) > 0 || m === fixedMember);
            const expCandsTextAnd = expCands.length === 2 ? `${expCands[0]}と${expCands[1]}` : expCands.join("や");
            reasonHtml = `この日の公演は${fixedMember}ポジの出演経験がある${expCandsTextAnd}が出演予定。他の出演メンバーのポジションの兼ね合いから、${fixedMember}ポジには${candsTextAnd}のどちらかが入ると予想。${warningBadge}`;
          } else {
            if (dupSourcePosIdxs.length > 0 && cands.length === 2) {
              const dupPosName = `${stage.fixed[dupSourcePosIdxs[0]]}ポジ`;
              
              const relatedPosIdxs = Array.from(new Set([pIdx, ...dupSourcePosIdxs])).sort((a, b) => a - b);
              const pos1Name = `${stage.fixed[relatedPosIdxs[0]]}ポジ`;
              const pos2Name = `${stage.fixed[relatedPosIdxs[1]]}ポジ`;

              reasonHtml = `この日の公演は${fixedMember}ポジの経験者がいないため、${dupPosName}でポジション被りとなる${candsTextAnd}のどちらかが${pos1Name}ポジ、どちらかが${pos2Name}ポジに入ると予想。${warningBadge}`;
            } else {
              reasonHtml = `この日の公演は${fixedMember}ポジの経験者がいないため、他の出演メンバーのポジションの兼ね合いから、${fixedMember}ポジには${candsTextOr}のいずれかのメンバーが入ると予想。${warningBadge}`;
            }
          }
        } else {
          const isFixedMemberAttending = inputSet.has(fixedMember);

          if (isExperienced) {
            if (assignedName === fixedMember) {
              if (orderedUnders.length === 0) {
                reasonHtml = `${assignedName}は「${stageName}」公演の初日メンバーであり、${assignedName}ポジの経験者が現役メンバーにいないため、${assignedName}が入ると予想。`;
              } else if (availableUnders.length === 0) {
                const undersText = formatUndersText(absentUnders);
                reasonHtml = `${assignedName}は「${stageName}」公演の初日メンバーであり、この日の公演は${fixedMember}ポジの出演経験がある${undersText}の出演予定もないため、${assignedName}が入ると予想。`;
              } else {
                const u1 = availableUnders[0];
                const u1PosIdx = memberToPosMap[u1];
                const u1PosName = u1PosIdx !== undefined ? stage.fixed[u1PosIdx] : "";
                const u1PosText = u1PosName ? `${u1PosName}ポジ` : "他のポジション";
                reasonHtml = `この日の公演は${u1}も出演予定だが、${assignedName}は「${stageName}」公演の初日メンバーであり、${u1}は${u1PosText}に入る可能性が高いと予想し、${assignedName}が入ると予想。`;
              }
            } else {
              if (isFixedMemberAttending) {
                const fixedMemberAssignedPosIdx = memberToPosMap[fixedMember];
                const fixedMemberAssignedPosName = fixedMemberAssignedPosIdx !== undefined ? stage.fixed[fixedMemberAssignedPosIdx] : "";
                const fixedMemberPosText = fixedMemberAssignedPosName ? `${fixedMemberAssignedPosName}ポジ` : "他のポジション";

                reasonHtml = `この日の公演は初日メンバーの${fixedMember}も出演予定だが、${fixedMember}は${fixedMemberPosText}で出演すると予想されるため、${fixedMember}ポジの出演経験がある${assignedName}が${fixedMember}ポジに入ると予想。`;
              } else {
                if (availableUnders.length <= 1) {
                  if (absentUnders.length === 0) {
                    reasonHtml = `この日の公演は初日メンバーの${fixedMember}の出演予定がないため、${fixedMember}ポジの出演経験がある${assignedName}が${fixedMember}ポジに入ると予想。`;
                  } else {
                    const undersText = formatUndersText(absentUnders);
                    reasonHtml = `この日の公演は初日メンバーの${fixedMember}の出演予定がなく、${undersText ? fixedMember + 'ポジの出演経験がある' + undersText + 'の出演予定もないため、' : ''}${fixedMember}ポジの出演経験がある${assignedName}が${fixedMember}ポジに入ると予想。`;
                  }
                } else {
                  const u2 = availableUnders.find(u => u !== assignedName && u !== "-" && u !== "－");
                  if (u2) {
                    const u2PosIdx = memberToPosMap[u2];
                    const u2PosName = u2PosIdx !== undefined ? stage.fixed[u2PosIdx] : "";
                    const u2PosText = u2PosName ? `${u2PosName}ポジ` : "他のポジション";
                    
                    const coop = getCoopProbability(assignedName, u2, pIdx, u2PosIdx, validShows);

                    if (coop.total > 0) {
                      if (coop.countDefault > 0 && coop.countSwapped === 0) {
                        reasonHtml = `この日の公演は${fixedMember}ポジの出演経験がある${u2}も出演予定だが、過去に${u2}と共演した公演では全て${assignedName}が${fixedMember}ポジに入っているため、${assignedName}が${fixedMember}ポジに入ると予想。`;
                      } else if (coop.countSwapped > 0 && coop.countDefault === 0) {
                        reasonHtml = `この日の公演は${fixedMember}ポジの出演経験がある${u2}も出演予定。過去に共演した公演では${u2}が${fixedMember}ポジ、${assignedName}が${u2PosText}に入っていたが、他の出演メンバーのポジションの兼ね合いから${assignedName}が${fixedMember}ポジに入ると予想。`;
                      } else {
                        reasonHtml = `この日の公演は${fixedMember}ポジの出演経験がある${u2}も出演予定だが、過去に共演した公演のデータから${assignedName}が${fixedMember}ポジに入ると予想。<br><span class="text-xs text-pink-600 font-bold mt-1 inline-block">⚠︎ ${assignedName} ${coop.p1}%、${u2} ${coop.p2}%</span>`;
                      }
                    } else {
                      const assignedTotalInPos = getMemberStats(assignedName).posCountMap[fixedMember] || 0;
                      const altPosName = u2PosName;
                      const altPosCount = altPosName ? (getMemberStats(assignedName).posCountMap[altPosName] || 0) : 0;
                      const uniquePosCount = getMemberStats(assignedName).uniquePositionsCount;

                      if (uniquePosCount > 1 && altPosName) {
                        reasonHtml = `${assignedName}は「${stageName}」公演で${fixedMember}ポジや${altPosName}ポジなど${uniquePosCount}ポジションでの出演経験があるが、他のメンバーのポジションの兼ね合いから、この日の公演は${fixedMember}ポジと${altPosName}ポジのどちらかでの出演になる可能性が高いと予想。${fixedMember}ポジでの出演回数が${assignedTotalInPos}回、${altPosName}ポジでの出演回数が${altPosCount}回のため、この日の公演は${fixedMember}ポジに入ると予想。`;
                      } else {
                        reasonHtml = `この日の公演は${fixedMember}ポジの出演経験がある${u2}も出演予定だが、${u2}は${u2PosText}で出演する可能性が高いと予想し、${assignedName}が${fixedMember}ポジに入ると予想。`;
                      }
                    }
                  } else {
                    reasonHtml = `この日の公演は初日メンバーの${fixedMember}の出演予定がないため、${fixedMember}ポジの出演経験がある${assignedName}が${fixedMember}ポジに入ると予想。`;
                  }
                }
              }
            }
          } else {
            const isStageFirstTimer = (stats.totalCount === 0);
            if (isStageFirstTimer) {
              reasonHtml = `${assignedName}はこの日に「${stageName}」公演の初日を迎える予定だが、他の出演メンバーのポジションの兼ね合いから${assignedName}が${fixedMember}ポジに入ると予想。`;
            } else {
              if (isFixedMemberAttending) {
                const fixedMemberAssignedPosIdx = memberToPosMap[fixedMember];
                const fixedMemberAssignedPosName = fixedMemberAssignedPosIdx !== undefined ? stage.fixed[fixedMemberAssignedPosIdx] : "";
                const fixedMemberPosText = fixedMemberAssignedPosName ? `${fixedMemberAssignedPosName}ポジ` : "他のポジション";

                reasonHtml = `この日の公演は初日メンバーの${fixedMember}も出演予定だが、${fixedMember}は${fixedMemberPosText}で出演すると予想されるため、${assignedName}が${fixedMember}ポジに入ると予想。`;
              } else {
                reasonHtml = `この日の公演は初日メンバーの${fixedMember}の出演予定がないため、${assignedName}が${fixedMember}ポジに入ると予想。`;
              }
            }
          }
        }

        const hasWarning = reasonHtml.includes('⚠︎');

        const card = document.createElement('div');
        card.className = "bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs space-y-1.5";
        card.innerHTML = `
          <div class="flex justify-between items-center font-bold">
            <span class="text-slate-700">【${escapeHtml(fixedMember)}ポジション】</span>
            <div class="flex items-center gap-2">
              ${isExperienced ? '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded font-bold">☑ 出演あり</span>' : '<span class="bg-amber-100 text-amber-700 text-[10px] px-2 py-0.5 rounded font-bold">初挑戦</span>'}
              ${hasWarning ? '' : `<span class="text-pink-600 text-sm">予想: ${escapeHtml(displayAssignedName)}</span>`}
            </div>
          </div>
          ${reasonHtml ? `<div class="text-slate-600 leading-relaxed">${reasonHtml}</div>` : ''}
        `;
        positionsList.appendChild(card);
      });
    }

    function onSearchInput(val) {
      const suggestBox = document.getElementById('searchSuggest');
      if (!val.trim()) { suggestBox.classList.add('hidden'); return; }
      
      const query = val.trim().toLowerCase();
      let matches = [];

      const stageSource = Object.keys(GLOBAL_STAGE_DATABASE).length > 0 ? GLOBAL_STAGE_DATABASE : STAGE_DATABASE;
      Object.keys(stageSource).forEach(key => {
        const stage = stageSource[key];
        if (stage.name.toLowerCase().includes(query) || stage.id.toLowerCase().includes(query)) {
          matches.push({ type: 'stage', label: stage.name, key: key });
        }
      });

      const allUniqueMembers = getAllUniqueMembers();
      allUniqueMembers.forEach(name => {
        if (name !== "-" && name !== "－" && name.toLowerCase().includes(query)) {
          matches.push({ type: 'member', label: name, name: name });
        }
      });

      if (matches.length === 0) { suggestBox.classList.add('hidden'); return; }

      suggestBox.innerHTML = '';
      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = "p-3 hover:bg-pink-50 cursor-pointer flex justify-between items-center";
        div.innerHTML = `
          <span class="font-bold text-slate-800">${escapeHtml(m.label)}</span>
          <span class="text-[10px] font-bold px-2 py-1 rounded ${m.type === 'stage' ? 'bg-pink-100 text-pink-700' : 'bg-slate-100 text-slate-600'}">
            ${m.type === 'stage' ? '公演' : 'メンバー'}
          </span>`;
        div.onclick = () => {
          suggestBox.classList.add('hidden');
          document.getElementById('searchInput').value = '';
          if (m.type === 'member') openMemberDetail(m.name);
          else if (m.type === 'stage') selectStage(m.key);
        };
        suggestBox.appendChild(div);
      });
      suggestBox.classList.remove('hidden');
    }

      document.getElementById('navStageDetail').classList.add('hidden');
      document.getElementById('navMemberSearching').classList.remove('hidden');

    }

    function formatHistoryStageTitle(item) {
      const baseName = item.baseStageName;
      const sub = (item.subTitle || "").trim();
      const rawTitle = (item.displayTitle || item.title || "").trim();

      if (sub.includes("初日") || rawTitle.includes("初日")) {
        return `「${baseName}」初日`;
      }
      if (sub.includes("千秋楽") || rawTitle.includes("千秋楽")) {
        return `「${baseName}」千秋楽`;
      }
      if (sub.includes("生誕祭") || rawTitle.includes("生誕祭")) {
        let name = sub.replace(/生誕祭/g, "").trim();
        if (!name) name = selectedMemberName;
        if (!name.startsWith("🎂")) name = "🎂" + name;
        return `「${baseName}」 <span class="text-[0.85em] font-normal">${escapeHtml(name)}</span>`;
      }
      if (sub.includes("卒業公演") || rawTitle.includes("卒業公演")) {
        let name = sub.replace(/卒業公演/g, "").trim();
        if (!name) name = selectedMemberName;
        if (!name.startsWith("🎓")) name = "🎓" + name;
        return `「${baseName}」 <span class="text-[0.85em] font-normal">${escapeHtml(name)}</span>`;
      }

      return `「${baseName}」`;
    }

    function renderMemberDetailView() {
      const dataSource = ALL_SCHEDULE_DATA.length > 0 ? ALL_SCHEDULE_DATA : SCHEDULE_DATA;
      const memberShows = dataSource.filter(item => item.membersArray.includes(selectedMemberName));
      document.getElementById('totalPerfBadge').innerText = `総出演回数: ${memberShows.length}回`;

      const showCountsMap = {};
      const posDetailMap = {};

      memberShows.forEach(item => {
        const baseName = item.baseStageName; 
        showCountsMap[baseName] = (showCountsMap[baseName] || 0) + 1;

        if (!posDetailMap[baseName]) posDetailMap[baseName] = {};
        const stageObj = GLOBAL_STAGE_DATABASE[baseName] || STAGE_DATABASE[baseName];
        
        if (stageObj && stageObj.fixed && item.positionsArray) {
          const posIdx = item.positionsArray.indexOf(selectedMemberName);
          if (posIdx !== -1 && stageObj.fixed[posIdx]) {
            const posName = stageObj.fixed[posIdx];
            posDetailMap[baseName][posName] = (posDetailMap[baseName][posName] || 0) + 1;
          }
        }
      });

      const breakdownList = document.getElementById('showsBreakdownList');
      breakdownList.innerHTML = '';
      Object.entries(showCountsMap).forEach(([title, count]) => {
        const li = document.createElement('li');
        li.className = "bg-slate-50 p-2.5 rounded border border-slate-200 space-y-1";

        let posTextArray = [];
        if (posDetailMap[title]) {
          Object.entries(posDetailMap[title]).forEach(([pName, pCount]) => {
            posTextArray.push(`${pName}ポジ: ${pCount}回`);
          });
        }
        const subPosText = posTextArray.length > 0 ? posTextArray.join(' / ') : '';

        li.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-700 cursor-pointer hover:text-pink-600 hover:underline" onclick="selectStage('${title}')">「${escapeHtml(title)}」公演</span> 
            <span class="bg-pink-100 text-pink-700 font-bold px-2 py-0.5 rounded">${count}回</span>
          </div>
          ${subPosText ? `<div class="text-[11px] text-slate-500 font-medium pl-1">${escapeHtml(subPosText)}</div>` : ''}
        `;
        breakdownList.appendChild(li);
      });

      const historyList = document.getElementById('memberShowsHistoryList');
      historyList.innerHTML = '';
      memberShows.slice().reverse().forEach((item, index) => {
        const countNum = memberShows.length - index;
        const div = document.createElement('div');
        div.className = "p-2 bg-slate-50 border border-slate-200 rounded text-xs flex gap-3 items-center cursor-pointer hover:bg-pink-50 transition";
        div.onclick = () => jumpToSchedule(item.date, item.id);
        
        let targetPositionName = selectedMemberName;

        const stageObj = GLOBAL_STAGE_DATABASE[item.baseStageName] || STAGE_DATABASE[item.baseStageName];
        if (stageObj && stageObj.fixed && item.positionsArray && item.positionsArray.length > 0) {
          const posIndex = item.positionsArray.indexOf(selectedMemberName);
          if (posIndex !== -1 && stageObj.fixed[posIndex]) {
            targetPositionName = stageObj.fixed[posIndex];
          }
        }

        const formattedStageLabel = formatHistoryStageTitle(item);

        div.innerHTML = `
          <span class="font-bold text-slate-400 w-4 text-right">${countNum}</span>
          <span class="text-slate-600">${escapeHtml(item.date)}</span>
          <span class="font-bold text-slate-800 flex-1 truncate">${formattedStageLabel}</span>
          <span class="text-pink-600 font-bold whitespace-nowrap">${escapeHtml(targetPositionName)}</span>
        `;
        historyList.appendChild(div);
      });
    }

    function filterSchedule(filter, btn) {
      currentScheduleFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = "filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200";
      });
      btn.className = "filter-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap";
      renderCalendar();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
    }
  </script>
</body>
</html>
