<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劇場公演 データサイト</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 75px; }
    .avatar-box {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .member-first { color: #db2777; font-weight: 700; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; display: inline-block; padding: 0.125rem 0; }
    .member-first:hover { opacity: 0.7; }
    .member-under { color: #b45309; font-weight: 700; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; display: inline-block; padding: 0.125rem 0; }
    .member-under:hover { opacity: 0.7; }
    /* カレンダーグリッド用スタイル */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      background-color: #e2e8f0;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .cal-cell {
      background-color: #ffffff;
      min-height: 70px;
      padding: 4px;
      display: flex;
      flex-direction: column;
    }
    .cal-cell.other-month { background-color: #f8fafc; color: #94a3b8; }
    .cal-cell.today { background-color: #fdf2f8; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
  <!-- Header -->
  <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" onclick="goHome()">
        <i class="fa-solid fa-masks-theater"></i> 劇場公演 データサイト
      </h1>
    </div>
    <!-- 検索バー ＆ サジェスト -->
    <div class="max-w-4xl mx-auto mt-3 relative">
      <div class="relative">
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="演目名 または メンバー名 で検索" 
               class="w-full pl-9 pr-4 py-2 bg-white text-slate-800 text-sm rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-pink-300">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>
      <div id="searchSuggest" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-72 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
    </div>
  </header>
  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4">
    <!-- 通常タブコンテンツ -->
    <div id="mainTabsContainer">
      <!-- Tab 1: カレンダー -->
      <section id="tab-calendar" class="tab-content">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
            <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
              <i class="fa-regular fa-calendar-days text-pink-500"></i> スケジュール
            </h2>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
              <!-- ビュー切り替えボタン -->
              <div class="bg-slate-100 p-0.5 rounded-lg border border-slate-200 flex text-[10px]">
                <button id="viewListBtn" onclick="toggleCalendarView('list')" class="px-2.5 py-1 rounded-md font-bold transition bg-white text-pink-600 shadow-sm">
                  <i class="fa-solid fa-list mr-1"></i> リスト
                </button>
                <button id="viewGridBtn" onclick="toggleCalendarView('grid')" class="px-2.5 py-1 rounded-md font-bold transition text-slate-600 hover:text-pink-600">
                  <i class="fa-solid fa-table-cells mr-1"></i> 月間
                </button>
              </div>
              <div class="flex items-center gap-1 bg-slate-50 p-1 rounded-lg border border-slate-200">
                <button onclick="changeMonth(-1)" class="p-1.5 text-slate-400 hover:text-pink-600 rounded hover:bg-slate-200"><i class="fa-solid fa-chevron-left"></i></button>
                <select id="yearSelect" onchange="onDateChange()" class="bg-transparent text-slate-700 text-sm font-bold px-1 py-1 focus:outline-none cursor-pointer"></select>
                <select id="monthSelect" onchange="onDateChange()" class="bg-transparent text-slate-700 text-sm font-bold px-1 py-1 focus:outline-none cursor-pointer"></select>
                <button onclick="changeMonth(1)" class="p-1.5 text-slate-400 hover:text-pink-600 rounded hover:bg-slate-200"><i class="fa-solid fa-chevron-right"></i></button>
              </div>
            </div>
          </div>
          <!-- 劇場選択タブ -->
          <div class="flex flex-nowrap overflow-x-auto gap-1.5 mb-4 pb-2">
            <button onclick="filterSchedule('ALL', this)" class="filter-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap">全劇場</button>
            <button onclick="filterSchedule('AKB48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">AKB48劇場</button>
            <button onclick="filterSchedule('SKE48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">SKE48劇場</button>
            <button onclick="filterSchedule('NMB48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">NMB48劇場</button>
            <button onclick="filterSchedule('HKT48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">HKT48劇場</button>
            <button onclick="filterSchedule('NGT48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">NGT48劇場</button>
            <button onclick="filterSchedule('STU48', this)" class="filter-btn bg-slate-100 text-slate-600 border border-slate-200 text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap hover:bg-slate-200">STU48劇場</button>
          </div>
          
          <div id="calendarList" class="space-y-3"></div>
          <div id="calendarGrid" class="hidden"></div>
        </div>
      </section>
      <!-- Tab 2: 一覧表 -->
      <section id="tab-positions" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <h2 id="posStageTitle" class="text-lg font-bold text-slate-800 mb-4">公演名</h2>
          <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-inner">
            <table class="w-full text-left text-sm border-collapse min-w-max">
              <thead><tr id="positionTableHeader" class="bg-slate-50 border-b border-slate-200"></tr></thead>
              <tbody id="positionTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>
      <!-- Tab 3: 日別表 -->
      <section id="tab-stage-daily" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-table-cells text-pink-500"></i> 日別表
          </h2>
          <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-inner">
            <table class="w-full text-left text-sm border-collapse min-w-max">
              <thead><tr id="dailyTableHeader" class="bg-slate-50 border-b border-slate-200"></tr></thead>
              <tbody id="dailyTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>
      <!-- Tab 4: 予想 -->
      <section id="tab-forecast" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-4">
          <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-pink-500"></i> ポジション予想
          </h2>
          <div class="space-y-2">
            <label class="block text-xs font-bold text-slate-600">出演メンバーを「、」または「・」区切りで入力してください。</label>
            <textarea id="forecastInputText" rows="3" placeholder="例: 小栗有以・倉野尾成美・佐藤綺星・下尾みう・鈴木くるみ・千葉恵里・永野芹佳・水島美結・向井地美音・村山彩希・山内瑞葵・山﨑空・秋山由奈・八木愛月..." class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-pink-300"></textarea>
            <button onclick="runForecast()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-lg text-sm shadow transition">
              予想を実行する
            </button>
          </div>
          <!-- 予想結果表示エリア -->
          <div id="forecastResultArea" class="hidden space-y-4 pt-2 border-t border-slate-100">
            <div>
              <h3 class="text-xs font-bold text-slate-500 mb-2">【全メンバーの一覧（出演マーク付き）】</h3>
              <div id="forecastAllMembersGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-xs"></div>
            </div>
            <div>
              <h3 class="text-xs font-bold text-slate-500 mb-2">【ポジションの割り当て ＆ 予想理由】</h3>
              <div id="forecastPositionsList" class="space-y-3"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <!-- メンバー詳細コンテンツ -->
    <section id="memberDetailContainer" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="avatar-box bg-pink-600 text-white text-base font-bold shadow">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <h2 id="detailMemberName" class="text-xl font-bold text-slate-800">メンバー名</h2>
            <p class="text-xs text-pink-600 font-semibold">出演データ統計</p>
          </div>
        </div>
        <button onclick="goHome()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold border border-slate-200">
          <i class="fa-solid fa-xmark mr-1"></i> 閉じる
        </button>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-pink-500"></i> 出演統計
          </h3>
          <span id="totalPerfBadge" class="bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full">総出演回数: 0回</span>
        </div>
        <h4 class="text-xs font-bold text-slate-500 mb-2">演目ごとの出演回数</h4>
        <ul id="showsBreakdownList" class="space-y-2 text-xs"></ul>
      </div>

      <!-- 年別出演回数・ランキング・共演トップ10の表示エリア -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 space-y-4">
        <div>
          <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-calendar text-pink-500"></i> 年別出演回数
          </h3>
          <div id="yearlyBreakdownList" class="flex flex-wrap gap-2 text-xs"></div>
        </div>
        <div>
          <h3 id="rankingSectionTitle" class="text-sm font-bold text-slate-800 border-b pb-2 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-trophy text-pink-500"></i> 出演回数ランキング
          </h3>
          <ol id="memberRankingList" class="space-y-1 text-xs divide-y divide-slate-100"></ol>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-2 flex items-center gap-2">
            <i class="fa-solid fa-users text-pink-500"></i> 共演回数ランキング
          </h3>
          <ol id="coappearanceTopList" class="space-y-1 text-xs divide-y divide-slate-100"></ol>
        </div>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-pink-500"></i> 出演履歴
        </h3>
        <div id="memberShowsHistoryList" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
      </div>
    </section>
  </main>
  <!-- スケジュール詳細ポップアップ モーダル -->
  <div id="scheduleModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-4 shadow-2xl border border-slate-100 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <span id="modalTheater" class="text-[10px] font-bold px-2 py-0.5 rounded bg-pink-100 text-pink-700"></span>
          <h3 id="modalTitle" class="text-base font-bold text-slate-800 mt-1"></h3>
          <p id="modalDate" class="text-xs text-slate-500 font-medium"></p>
        </div>
        <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-600 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="modalMembersArea" class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs space-y-2">
        <div class="font-bold text-slate-700 flex justify-between items-center">
          <span>【出演メンバー / ポジション】</span>
          <span id="modalPosCount" class="text-[10px] text-pink-600 bg-pink-50 px-1.5 py-0.5 rounded border border-pink-200"></span>
        </div>
        <div id="modalMemberList" class="grid grid-cols-2 gap-1.5 pt-1"></div>
      </div>
      <div class="flex gap-2 pt-2">
        <button id="modalBtnGoStage" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-3 rounded-lg text-xs shadow transition text-center">
          演目詳細を開く
        </button>
        <button onclick="closeScheduleModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-3 rounded-lg text-xs transition">
          閉じる
        </button>
      </div>
    </div>
  </div>
  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
    <div id="navNormal" class="max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn active flex-1 py-3 text-center text-xs font-semibold text-pink-600">
        <i class="fa-regular fa-calendar-days text-base block mb-0.5"></i> カレンダー
      </button>
    </div>
    <div id="navStageDetail" class="hidden max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('positions')" id="nav-positions" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-users-rectangle text-base block mb-0.5"></i> 一覧表
      </button>
      <button onclick="switchTab('stage-daily')" id="nav-stage-daily" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-table-cells text-base block mb-0.5"></i> 日別表
      </button>
      <button onclick="switchTab('forecast')" id="nav-forecast" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-wand-magic-sparkles text-base block mb-0.5"></i> 予想
      </button>
      <button onclick="goHome()" id="nav-back" class="flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-rotate-left text-base block mb-0.5"></i> 戻る
      </button>
    </div>
    <div id="navMemberSearching" class="hidden max-w-4xl mx-auto flex justify-center py-3 bg-pink-50 text-pink-600 font-bold text-sm items-center gap-2 border-t-2 border-pink-500">
      <i class="fa-solid fa-user-gear"></i>
      <span>メンバー詳細表示中</span>
      <button onclick="goHome()" class="text-xs bg-pink-600 text-white px-3 py-1 rounded ml-2 shadow-sm">戻る</button>
    </div>
  </nav>
  <!-- JavaScript Logic -->
  <script>
    const MASTER_MEMBER_ORDER = [
      "秋山由奈", "新井彩永", "伊藤百花", "岩立沙穂", "太田有紀", "奥本カイリ", "小栗有以", "川村結衣", "行天優莉奈", "工藤華純",

      "長友彩海", "永野芹佳", "成田香姫奈", "橋本恵理子", "橋本陽菜", "畠山希美", "平田侑希", "福岡聖菜", "布袋百椛", "正鋳真優", 
      "水島美結", "武藤小麟", "八木愛月", "山内瑞葵", "山口結愛", "山﨑空", "山根涼羽", "大賀彩姫", "近藤沙樹", "丸山ひなた", 
      "髙橋舞桜", "田中沙友利", "牧戸愛茉", "森川優", "渡邉葵心", "大西ゆな", "長谷川百々花", "前田衣澄", "山内利乃明"
    ];
    let SCHEDULE_DATA = [];
    let ALL_SCHEDULE_DATA = []; 
    let GLOBAL_STAGE_DATABASE = {}; 
    let STAGE_DATABASE = {};
    let currentStageKey = null;
    let currentScheduleFilter = "ALL";
    let selectedMemberName = null;
    let currentSelectedMemberYear = null;
    let currentRankingYear = null;
    let showAllAppearanceRanking = false;
    let showAllCoappearanceRanking = false;
    let todayString = "";
    let calendarViewMode = 'list';
    const FALLBACK_SCHEDULE_2026 = [
      {
        "id": "akb_260807",
        "date": "2026-08-07 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演 初日",

        "positions": ["新井彩永", "久保姫菜乃", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛", "山﨑空"]
      },
      {

        "positions": ["福岡聖菜", "秋山由奈", "成田香姫奈", "奥本カイリ", "田中沙友利", "正鋳真優", "下尾みう", "近藤沙樹"]
      },
      {

        "members": ["太田有紀", "工藤華純", "黒須遥香", "迫由芽実", "佐藤綺星", "成田香姫奈", "福岡聖菜", "山内瑞葵"],

      }
    ];

    document.addEventListener("DOMContentLoaded", async () => {
      initYearMonthDropdowns();
      await loadAllYearsScheduleData(); 
      await onDateChange();
      document.addEventListener('click', (e) => {
        const suggestBox = document.getElementById('searchSuggest');
        const searchInput = document.getElementById('searchInput');
        if (suggestBox && !suggestBox.contains(e.target) && e.target !== searchInput) suggestBox.classList.add('hidden');
      });
    });

    function initYearMonthDropdowns() {
      const yearSelect = document.getElementById("yearSelect");
      const monthSelect = document.getElementById("monthSelect");
      yearSelect.innerHTML = ''; monthSelect.innerHTML = '';
      for (let y = 2026; y >= 2005; y--) yearSelect.appendChild(new Option(`${y}年`, y));
      for (let m = 1; m <= 12; m++) monthSelect.appendChild(new Option(`${m}月`, m < 10 ? `0${m}` : `${m}`));
      
      const now = new Date();
      yearSelect.value = now.getFullYear();
      monthSelect.value = (now.getMonth() + 1).toString().padStart(2, '0');
      
      const yStr = now.getFullYear();
      const mStr = (now.getMonth() + 1).toString().padStart(2, '0');
      const dStr = now.getDate().toString().padStart(2, '0');
      todayString = `${yStr}/${mStr}/${dStr}`;
    }

    function changeMonth(diff) {
      const yearSelect = document.getElementById("yearSelect");
      const monthSelect = document.getElementById("monthSelect");
      let y = parseInt(yearSelect.value, 10);
      let m = parseInt(monthSelect.value, 10);
      m += diff;
      if (m > 12) { m = 1; y++; }
      else if (m < 1) { m = 12; y--; }
      yearSelect.value = y.toString();
      monthSelect.value = (m < 10 ? "0" : "") + m;
      onDateChange();
    }

    async function fetchScheduleJson(groupName, year) {
      const fileName = `schedule_${groupName.toLowerCase()}_${year}.json`;
      try {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error("JSON not found");
        return await response.json();
      } catch (err) {
        return year == 2026 ? FALLBACK_SCHEDULE_2026 : [];
      }
    }

    async function loadAllYearsScheduleData() {
      let allList = [];
      const currentYear = new Date().getFullYear();
      const promises = [];
      
      for (let y = 2020; y <= currentYear; y++) {
        promises.push(fetchScheduleJson("akb48", y));
      }
      
      const results = await Promise.all(promises);
      results.forEach(rawData => {
        if (Array.isArray(rawData)) {
          allList = allList.concat(normalizeScheduleData(rawData));
        }
      });
      ALL_SCHEDULE_DATA = allList;
      generateGlobalStageDatabase(); 
    }

    function normalizeScheduleData(rawData) {
      return rawData.map(item => {
        let rawDateStr = item.date || "";
        let datePart = "", timePart = item.time || "";
        if (rawDateStr.includes(" ")) {
          const parts = rawDateStr.split(" ");
          datePart = parts[0].replace(/-/g, "/");
          timePart = timePart || parts[1];
        } else {
          datePart = rawDateStr.replace(/-/g, "/");
        }
        let rawTitle = item.title || item.stage || "";
        let mainTitle = rawTitle;
        let subTitle = item.event || item.subTitle || "";
        if (!subTitle) {
          const match = rawTitle.match(/^(「.*?」公演)(?:\s+(.*))?$/);
          if (match) {
            mainTitle = match[1];
            subTitle = match[2] || "";
          }
        }
        let baseStage = mainTitle.replace(/「|」|『|』/g, '').replace(/公演.*$/, '').trim();
        let membersArr = [];
        let performersStr = "";
        if (Array.isArray(item.members)) {
          membersArr = item.members.filter(m => m && m !== "-" && m !== "－");
          performersStr = membersArr.join("・");
        }
        let posArr = Array.isArray(item.positions) ? item.positions : [];
        return {
          id: item.id || `evt_${Math.random().toString(36).substring(2, 9)}`,
          date: datePart,
          time: timePart,
          theater: item.theater || "AKB48劇場",
          displayTitle: mainTitle,
          subTitle: subTitle,
          baseStageName: baseStage,
          performersText: performersStr,
          membersArray: membersArr,
          positionsArray: posArr
        };
      });
    }

    function generateGlobalStageDatabase() {
      GLOBAL_STAGE_DATABASE = {};
      ALL_SCHEDULE_DATA.forEach(item => {
        const base = item.baseStageName;
        if (!base) return;
        if (!GLOBAL_STAGE_DATABASE[base]) {
          GLOBAL_STAGE_DATABASE[base] = {
            id: base,
            name: `「${base}」公演`,
            group: item.theater.replace("劇場", "").trim() || "AKB48",
            fixed: [],
            allMembers: new Set(),
            schedules: []
          };
        }
        GLOBAL_STAGE_DATABASE[base].schedules.push(item);
        item.membersArray.forEach(m => { 
          if(m && m !== "-" && m !== "－") GLOBAL_STAGE_DATABASE[base].allMembers.add(m.trim()); 
        });
      });
      Object.keys(GLOBAL_STAGE_DATABASE).forEach(key => {
        const stage = GLOBAL_STAGE_DATABASE[key];
        stage.schedules.sort((a, b) => (a.date + " " + a.time).localeCompare(b.date + " " + b.time));
        const firstShow = stage.schedules.find(s => s.positionsArray && s.positionsArray.length > 0);
        if (firstShow) {
          stage.fixed = firstShow.positionsArray.map(m => (m === "-" || m === "－") ? "" : m);
        }
        const rawMembersSet = stage.allMembers;
        stage.allMembers = MASTER_MEMBER_ORDER.filter(m => rawMembersSet.has(m) || MASTER_MEMBER_ORDER.includes(m));
      });
    }

    function generateStageDatabase() {
      STAGE_DATABASE = {};
      SCHEDULE_DATA.forEach(item => {
        const base = item.baseStageName;
        if (!base) return;
        if (!STAGE_DATABASE[base]) {
          STAGE_DATABASE[base] = {
            id: base,
            name: `「${base}」公演`,
            group: item.theater.replace("劇場", "").trim() || "AKB48",
            fixed: [],
            allMembers: new Set(),
            schedules: []
          };
        }
        STAGE_DATABASE[base].schedules.push(item);
        item.membersArray.forEach(m => { 
          if(m && m !== "-" && m !== "－") STAGE_DATABASE[base].allMembers.add(m.trim()); 
        });
      });
      Object.keys(STAGE_DATABASE).forEach(key => {
        const stage = STAGE_DATABASE[key];
        stage.schedules.sort((a, b) => (a.date + " " + a.time).localeCompare(b.date + " " + b.time));
        
        if (GLOBAL_STAGE_DATABASE[key] && GLOBAL_STAGE_DATABASE[key].fixed.length > 0) {
          stage.fixed = GLOBAL_STAGE_DATABASE[key].fixed;
        } else {
          const firstShow = stage.schedules.find(s => s.positionsArray && s.positionsArray.length > 0);
          if (firstShow) {
            stage.fixed = firstShow.positionsArray.map(m => (m === "-" || m === "－") ? "" : m);
          }
        }
        
        const rawMembersSet = stage.allMembers;
        stage.allMembers = MASTER_MEMBER_ORDER.filter(m => rawMembersSet.has(m) || MASTER_MEMBER_ORDER.includes(m));
      });
    }

    function getAllUniqueMembers() {
      const set = new Set(MASTER_MEMBER_ORDER);
      const dataSource = ALL_SCHEDULE_DATA.length > 0 ? ALL_SCHEDULE_DATA : SCHEDULE_DATA;
      dataSource.forEach(item => {
        if (item.membersArray) {
          item.membersArray.forEach(m => { if (m && m !== "-" && m !== "－") set.add(m.trim()); });
        }
        if (item.positionsArray) {
          item.positionsArray.forEach(m => { if (m && m !== "-" && m !== "－") set.add(m.trim()); });
        }
      });
      return Array.from(set);
    }

    function getFilteredSchedules() {
      const year = document.getElementById("yearSelect").value;
      const month = document.getElementById("monthSelect").value;
      const datePrefix = `${year}/${month}`;
      return SCHEDULE_DATA.filter(item => {
        const matchesDate = item.date ? item.date.startsWith(datePrefix) : true;
        if (!matchesDate) return false;
        if (currentScheduleFilter === 'ALL') return true;
        return item.theater && item.theater.includes(currentScheduleFilter);
      });
    }

                  <span class="block text-xs font-bold text-pink-600">${item.time}</span>

    function renderCalendarGrid() {
      const gridContainer = document.getElementById('calendarGrid');
      gridContainer.innerHTML = '';
      const year = parseInt(document.getElementById("yearSelect").value, 10);
      const month = parseInt(document.getElementById("monthSelect").value, 10);
      const firstDay = new Date(year, month - 1, 1);
      const lastDay = new Date(year, month, 0);
      const startDayOfWeek = firstDay.getDay(); 
      const totalDays = lastDay.getDate();
      const filtered = getFilteredSchedules();
      const schedMap = {};
      filtered.forEach(item => {
        const dStr = item.date;
        if (!schedMap[dStr]) schedMap[dStr] = [];
        schedMap[dStr].push(item);
      });
      let html = `<div class="cal-grid">`;
      const dayLabels = ['日', '月', '火', '水', '木', '金', '土'];
      
      dayLabels.forEach((label, i) => {
        const color = i === 0 ? 'text-red-500' : (i === 6 ? 'text-blue-500' : 'text-slate-600');
        html += `<div class="bg-slate-100 p-1 text-center font-bold text-xs ${color}">${label}</div>`;
      });
      for (let i = 0; i < startDayOfWeek; i++) {
        html += `<div class="cal-cell other-month"></div>`;
      }
      for (let day = 1; day <= totalDays; day++) {
        const mStr = month.toString().padStart(2, '0');
        const dStr = day.toString().padStart(2, '0');
        const fullDateStr = `${year}/${mStr}/${dStr}`;
        const isToday = fullDateStr === todayString;
        const dayShows = schedMap[fullDateStr] || [];
        html += `
          <div class="cal-cell ${isToday ? 'today border border-pink-400' : ''}">
            <span class="text-[10px] font-bold ${isToday ? 'text-pink-600' : 'text-slate-600'}">${day}</span>
            <div class="space-y-1 mt-1 overflow-y-auto max-h-16 flex-1">
        `;
        dayShows.forEach(s => {
          html += `
            <div onclick="openScheduleModalById('${s.id}')" class="bg-pink-100 hover:bg-pink-200 text-pink-800 text-[9px] p-0.5 rounded leading-tight cursor-pointer truncate" title="${escapeHtml(s.baseStageName)}">
              ${escapeHtml(s.baseStageName)}
            </div>
          `;
        });
        html += `</div></div>`;
      }
      const totalCells = startDayOfWeek + totalDays;
      const remainingCells = (7 - (totalCells % 7)) % 7;
      for (let i = 0; i < remainingCells; i++) {
        html += `<div class="cal-cell other-month"></div>`;
      }
      html += `</div>`;
      gridContainer.innerHTML = html;
    }

  function renderPositions() {
  const stage = GLOBAL_STAGE_DATABASE[currentStageKey] || STAGE_DATABASE[currentStageKey];
  if (!stage) return;
  document.getElementById('posStageTitle').innerText = stage.name;
  
  const headerTr = document.getElementById('positionTableHeader');
  const tbody = document.getElementById('positionTableBody');
  headerTr.innerHTML = ''; tbody.innerHTML = '';
  if (stage.fixed.length === 0) return;
  const validShows = stage.schedules.filter(s => s.positionsArray && s.positionsArray.length > 0);
  const rowDataList = [];
  let maxCols = 0;
  stage.fixed.forEach((fixedMember, colIdx) => {
    const experiencedSet = new Set();
    validShows.forEach(show => {
      if (show.positionsArray && show.positionsArray[colIdx]) {
        const m = show.positionsArray[colIdx].trim();
        if (m && m !== "-" && m !== "－") experiencedSet.add(m);
      }
    });
    const undersOrdered = MASTER_MEMBER_ORDER.filter(m => m !== fixedMember && experiencedSet.has(m));
    
    const initialMembers = fixedMember ? [fixedMember, ...undersOrdered] : undersOrdered;
    const orderedMembers = initialMembers.filter(m => m && m !== "-" && m !== "－");
    if (orderedMembers.length > 0) {
      rowDataList.push({ fixedMember, orderedMembers });
      if (orderedMembers.length > maxCols) {
        maxCols = orderedMembers.length;
      }
    }
  });
  for (let i = 0; i < maxCols; i++) {
    const th = document.createElement('th');
    th.className = "p-2.5 min-w-[110px] text-center border-r border-slate-200 whitespace-nowrap";
    th.innerHTML = `<span class="text-xs font-bold text-slate-600">${i === 0 ? '初日' : `${i + 1}人目`}</span>`;
    headerTr.appendChild(th);
  }
  rowDataList.forEach(({ fixedMember, orderedMembers }) => {
    const tr = document.createElement('tr');
    tr.className = "border-b border-slate-100 hover:bg-slate-50";
    for (let i = 0; i < maxCols; i++) {
      const td = document.createElement('td');
      td.className = "p-2.5 text-center border-r border-slate-100 whitespace-nowrap";
      
      const member = orderedMembers[i];
      if (member && member !== "-" && member !== "－") {
        const isOriginal = (member === fixedMember);
        const className = isOriginal ? 'member-first' : 'member-under';
        td.innerHTML = `<span class="${className}" onclick="openMemberDetail('${escapeHtml(member)}')">${escapeHtml(member)}</span>`;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

function formatShortDate(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.replace(/-/g, '/').split('/');
  if (parts.length === 3) {
    const yy = parts[0].slice(-2);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    return `${yy}/${m}/${d}`;
  }
  return dateStr;
}

  const tbody = document.getElementById('dailyTableBody');
  
  headerTr.innerHTML = ''; tbody.innerHTML = '';
  if (!stage || stage.fixed.length === 0) return;

      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function getOrderedExperiencedMembers(pIdx, stageFixed, validShows) {
  const fixedMember = stageFixed[pIdx];
  const result = [];
  const seen = new Set();
  MASTER_MEMBER_ORDER.forEach(m => {
    if (m === fixedMember) return;
    const hasPerf = validShows.some(s => s.positionsArray?.[pIdx] === m);
    if (hasPerf && !seen.has(m)) {
      seen.add(m);
      result.push(m);
    }
  });
  validShows.forEach(s => {
    const m = s.positionsArray?.[pIdx];
    if (m && m !== "-" && m !== "－" && m !== fixedMember && !seen.has(m)) {
      seen.add(m);
      result.push(m);
    }
  });
  return result;
}

function findSharedOtherPosition(mem1, mem2, fixedMember, stage, validShows) {
  if (!stage || !Array.isArray(stage.fixed) || !Array.isArray(validShows)) {
    return null;
  }
  const fixedIndex = stage.fixed.indexOf(fixedMember);
  for (let pIdx = 0; pIdx < stage.fixed.length; pIdx++) {
    if (pIdx === fixedIndex) continue;
    let mem1HasPosition = false;
    let mem2HasPosition = false;
    validShows.forEach(show => {
      const member = show.positionsArray?.[pIdx];
      if (member === mem1) mem1HasPosition = true;
      if (member === mem2) mem2HasPosition = true;
    });
    if (mem1HasPosition && mem2HasPosition) {
      return stage.fixed[pIdx];
    }
  }
  return null;
}

function generateCooccurrenceReason(stageName, pos1, mem1, mem2, pos2, historyData, stage) {
  let countA = 0, countB = 0;

  if (Array.isArray(historyData) && stage) {
    const pos1Index = stage.fixed.indexOf(pos1);
    const pos2Index = stage.fixed.indexOf(pos2);

    if (pos1Index !== -1 && pos2Index !== -1) {
      historyData.forEach(perf => {
        if (perf.baseStageName !== stageName) return;
        if (!Array.isArray(perf.positionsArray)) return;

        const mem1Pos = perf.positionsArray[pos1Index];
        const mem2Pos = perf.positionsArray[pos2Index];

        if (mem1Pos === mem1 && mem2Pos === mem2) {
          countA++;
        } else if (mem2Pos === mem1 && mem1Pos === mem2) {
          countB++;
        }
      });
    }
  }

  const totalCooccurrences = countA + countB;

  let higherMem = '';
  let pct1 = 50;
  let pct2 = 50;

  if (totalCooccurrences > 0) {
    pct1 = Math.round((countA / totalCooccurrences) * 100);
    pct2 = 100 - pct1;

    if (countA > countB) {
      higherMem = mem1;
    } else if (countB > countA) {
      higherMem = mem2;
    }
  }

  let reasonText =
    `この日の「${stageName}」公演は、${pos1}ポジでの出演経験がある${mem1}と${mem2}の出演予定がある。`;

  reasonText +=
    `${mem1}と${mem2}は${pos1}ポジのほかに${pos2}ポジも覚えており、` +
    `どちらが${pos1}ポジに入るか${pos2}ポジに入るかは確定できないが、`;

  if (totalCooccurrences > 0) {
    reasonText +=
      `過去に${mem1}と${mem2}が「${stageName}」で共演したときは、` +
      `${mem1}が${pos1}ポジ・${mem2}が${pos2}ポジで出演したケースが${countA}回、` +
      `${mem2}が${pos1}ポジ・${mem1}が${pos2}ポジで出演したケースが${countB}回だったため、`;

    reasonText += higherMem
      ? `今回は${higherMem}が${pos1}ポジに入る可能性が高いと予想。`
      : `五分五分の可能性が高いと予想。`;
  } else {
    reasonText +=
      `過去の「${stageName}」公演で${mem1}と${mem2}の共演経験もないため、五分五分の可能性になると予想。`;
  }

  return {
    reasonHtml: reasonText,
    percentText: `${mem1} ${pct1}%　${mem2} ${pct2}%`
  };
}

function formatAbsenceMemberListText(list) {
  if (!list || list.length === 0) return "";

  if (list.length === 1) {
    return list[0];
  }

  if (list.length === 2) {
    return `${list[0]}や${list[1]}`;
  }

  return `${list[0]}や${list[1]}など`;
}

function formatAbsencePhrase(fixedMember, absenceExpList) {
  if (!absenceExpList || absenceExpList.length === 0) {
    return `初日メンバーである${fixedMember}の出演予定がない`;
  }

  const expText = formatAbsenceMemberListText(absenceExpList);

  return (
    `初日メンバーである${fixedMember}と、` +
    `${fixedMember}ポジでの出演経験がある${expText}の出演予定がない`
  );
}

function formatMemberListText(list) {
  if (!list || list.length === 0) return "";

  if (list.length === 1) {
    return list[0];
  }

  if (list.length === 2) {
    return `${list[0]}と${list[1]}`;
  }

  return `${list.slice(0, -1).join('や')}や${list[list.length - 1]}`;
}

function sortByInputOrder(members, inputMemberList) {
  return [...members].sort((a, b) => {
    let idxA = inputMemberList.indexOf(a);
    let idxB = inputMemberList.indexOf(b);

    if (idxA === -1) idxA = 999;
    if (idxB === -1) idxB = 999;

    return idxA - idxB;
  });
}

function getCircleNum(num) {
  const circles = [
    "①", "②", "③", "④", "⑤",
    "⑥", "⑦", "⑧", "⑨", "⑩"
  ];

  return circles[num - 1] || `(${num})`;
}

  const posIndex = stage.fixed.indexOf(pos);
  if (posIndex === -1) return 0;

  // 過去の公演データ(validShows)から、そのポジション(posIndex)にメンバー(m)が出演した回数を実際にカウント
  return validShows.filter(show => 
    show.positionsArray && show.positionsArray[posIndex] === m
  ).length;
};

        const countThisPos = getCount(confirmedMember, fixedMember);
        const countOtherPos = getCount(confirmedMember, otherFixedMember);
        const totalCount = countThisPos + countOtherPos || 1;

        const mainRatio = countThisPos / totalCount;
        const isHigh = mainRatio >= 0.5;
        const expectationWord = isHigh ? "高い" : "低い";

        const confirmedMemberPct = Math.round(mainRatio * 100);
        const remainingPct = 100 - confirmedMemberPct;

        const confirmedMemberList = Object.values(confirmedAssignments);
        const unassignedMembers = inputMemberList.filter(
          m => !confirmedMemberList.includes(m) && m !== confirmedMember
        );
        const otherMemText = formatMemberListText(unassignedMembers);

        const eachOtherPct = Math.round((remainingPct / 2) / (unassignedMembers.length / 2 || 1));

        let pctMap = {};
        pctMap[confirmedMember] = confirmedMemberPct;
        unassignedMembers.forEach(m => {
          pctMap[m] = eachOtherPct;
        });

        badgeHtml = getBadgeHtml(pIdx, fixedMember, [confirmedMember], false);

        const dupPosName = unassignedMembers.length >= 2 ? "他ポジション" : "他ポジション";

        let patterns = [];
        patterns.push(
          `① ${confirmedMember}は${otherFixedMember}ポジでの出演経験もあるため、この日の「${stageName}」公演で` +
          `${confirmedMember}が${fixedMember}ポジと${otherFixedMember}ポジのどちらで出演になるか断定はできないが、` +
          `過去に${confirmedMember}が「${stageName}」公演に出演した際、` +
          `${fixedMember}ポジでの出演が${countThisPos}回、${otherFixedMember}ポジでの出演が${countOtherPos}回のため、` +
          `${fixedMember}ポジで出演する可能性は${expectationWord}と予想。`
        );

        patterns.push(
          `② ${dupPosName}でポジション被りとなる${otherMemText}のどちらかが${dupPosName}、` +
          `どちらかが${fixedMember}ポジで出演する可能性。`
        );

        reasonHtml =
          `この日の「${stageName}」公演は、${fixedMember}ポジでの出演経験がある${confirmedMember}の出演予定がある。` +
          `他の出演メンバーのポジションの兼ね合いから、次の${patterns.length}つのパターンが考えられる。<br><br>${patterns.join('<br><br>')}`;

        const sortedMembers = sortByInputOrder(Object.keys(pctMap), inputMemberList);
        percentText = sortedMembers.map(m => `${m} ${pctMap[m]}%`).join('　');

      } else {
        badgeHtml = getBadgeHtml(pIdx, fixedMember, [confirmedMember], true);

        reasonHtml =
          `この日の「${stageName}」公演は、` +
          `${fixedMember}ポジでの出演経験がある${confirmedMember}が${fixedMember}ポジで出演すると予想。`;

        percentText = `${confirmedMember} 100%`;
      }

    // -------------------------------------------------------------
    // 【パターン4】同じポジションの経験者が2人以上いて被っている場合
    // -------------------------------------------------------------
    } else if (expAttending.length >= 2) {
      const memText = formatMemberListText(expAttending);
      const memberCount = expAttending.length;

      badgeHtml = getBadgeHtml(pIdx, fixedMember, expAttending, false);

      const counts = {};
      expAttending.forEach(m => counts[m] = 0);
      let totalCount = 0;
      let hasHistoryData = false;

      // --- 【修正】2人の場合は「共演時のポジ割り振り履歴」、3人以上の場合は「該当ポジでの個別の出演回数」を集計 ---
      if (memberCount === 2) {
        const sharedPosIndices = [pIdx];
        const sharedPosNames = [fixedMember];

        stage.fixed.forEach((otherFm, otherPIdx) => {
          if (otherPIdx === pIdx) return;
          const expList = (initialAttendingExpMap[otherPIdx] || []);
          if (expAttending.every(m => expList.includes(m))) {
            sharedPosIndices.push(otherPIdx);
            sharedPosNames.push(otherFm);
          }
        });

        if (sharedPosIndices.length > 1) {
          validShows.forEach(perf => {
            if (!Array.isArray(perf.positionsArray)) return;
            const allPresent = expAttending.every(m => perf.positionsArray.includes(m));
            if (!allPresent) return;

            const inSharedPos = expAttending.every(m => {
              const posIdx = perf.positionsArray.indexOf(m);
              return sharedPosIndices.includes(posIdx);
            });

            if (inSharedPos) {
              const assignedMem = perf.positionsArray[pIdx];
              if (counts[assignedMem] !== undefined) {
                counts[assignedMem]++;
                totalCount++;
              }
            }
          });
        }
        hasHistoryData = (totalCount > 0);
      } else {
        // 3人以上の場合は、そのポジション(pIdx)での個別の出演回数を集計
        expAttending.forEach(m => {
          const cnt = validShows.filter(show => 
            show.positionsArray && show.positionsArray[pIdx] === m
          ).length;
          counts[m] = cnt;
          totalCount += cnt;
        });
        hasHistoryData = (totalCount > 0);
      }

      const subjectWord = memberCount === 2 ? "どちら" : "誰";
      const equalWord = memberCount === 2 ? "五分五分" : "均等";

      if (!hasHistoryData) {
        reasonHtml =
          `この日の「${stageName}」公演は、${fixedMember}ポジでの出演経験がある${memText}の出演予定がある。` +
          `他の出演メンバーのポジションの兼ね合いから、${memText}の${subjectWord}が${fixedMember}ポジで出演するかは断定できないが、` +
          `過去の「${stageName}」公演で${memText}の出演実績が同等のため、${equalWord}の可能性になると予想。`;

        const equalPct = Math.floor(100 / memberCount);
        const sortedMembers = sortByInputOrder(expAttending, inputMemberList);
        percentText = sortedMembers.map(m => `${m} ${equalPct}%`).join('　');

      } else {
        let maxCount = -1;
        let higherMem = "";
        let tieForMax = false;

        expAttending.forEach(m => {
          if (counts[m] > maxCount) {
            maxCount = counts[m];
            higherMem = m;
            tieForMax = false;
          } else if (counts[m] === maxCount && maxCount > 0) {
            tieForMax = true;
          }
        });

        const pctMap = {};
        let sumPct = 0;

        expAttending.forEach((m, idx) => {
          if (idx === memberCount - 1) {
            pctMap[m] = 100 - sumPct;
          } else {
            const pct = Math.round((counts[m] / totalCount) * 100);
            pctMap[m] = pct;
            sumPct += pct;
          }
        });

        let detailText = "";
        if (memberCount === 2) {
          const m1 = expAttending[0];
          const m2 = expAttending[1];
          detailText = `${m1}が${counts[m1]}回、${m2}が${counts[m2]}回出演しているため、`;
        } else {
          const countDetails = expAttending.map(m => `${m}が${counts[m]}回`).join('、');
          detailText = `${fixedMember}ポジでの出演が${countDetails}だったため、`;
        }

        const conclusionText = (!tieForMax && higherMem)
          ? `今回は${higherMem}が${fixedMember}ポジで出演する可能性が高いと予想。`
          : `${equalWord}の可能性が高いと予想。`;

        reasonHtml =
          `この日の「${stageName}」公演は、${fixedMember}ポジでの出演経験がある${memText}の出演予定がある。` +
          `過去に${memText}が「${stageName}」公演に出演した際、` +
          `${detailText}${conclusionText}`;

        const sortedMembers = sortByInputOrder(expAttending, inputMemberList);
        percentText = sortedMembers.map(m => `${m} ${pctMap[m]}%`).join('　');
      }
    }

    // カードDOMの描画
    const card = document.createElement('div');
    card.className = "bg-white p-3 rounded-lg border border-slate-200 shadow-sm space-y-2";

    card.innerHTML = `
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <span class="font-bold text-slate-800 text-sm">【${fixedMember}ポジ】</span>
        ${badgeHtml}
      </div>

      <p class="text-xs text-slate-600 leading-relaxed">
        ${reasonHtml}
      </p>

      <div class="text-sm font-bold text-slate-800 pt-1 border-t border-slate-100">
        ${percentText}
      </div>
    `;

    positionsList.appendChild(card);
  });
}

    function getDefaultYearForMember(memberName) {
      if (MASTER_MEMBER_ORDER.includes(memberName)) {
        return "2026";
      }
      let lastYear = null;
      ALL_SCHEDULE_DATA.forEach(item => {
        const isPerformer = (item.membersArray && item.membersArray.includes(memberName)) ||
                            (item.positionsArray && item.positionsArray.includes(memberName));
        if (isPerformer && item.date) {
          const year = item.date.split('/')[0];
          if (!lastYear || year > lastYear) {
            lastYear = year;
          }
        }
      });
      return lastYear || "2026";
    }

    function sortMemberRankings(arr) {
      arr.sort((a, b) => {
        if (b.count !== a.count) {
          return b.count - a.count;
        }
        const idxA = MASTER_MEMBER_ORDER.indexOf(a.name);
        const idxB = MASTER_MEMBER_ORDER.indexOf(b.name);
        if (idxA !== -1 && idxB !== -1) {
          return idxA - idxB;
        }
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return a.name.localeCompare(b.name, 'ja');
      });
    }

          openMemberDetail(memberName);
          suggestBox.classList.add('hidden');
          document.getElementById('searchInput').value = '';
        };
        suggestBox.appendChild(btn);
      });

      suggestBox.classList.remove('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
