<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劇場公演 データサイト</title>
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 75px; }
    .avatar-box {
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .horizontal-scroll-list {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .horizontal-scroll-list::-webkit-scrollbar { height: 4px; }
    .horizontal-scroll-list::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 2px; }
    .co-star-card { scroll-snap-align: start; flex: 0 0 100px; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold flex items-center gap-2 cursor-pointer" onclick="goHome()">
        <i class="fa-solid fa-masks-theater"></i> 劇場公演 データサイト
      </h1>
      
      <!-- ⑥ 公演切り替えドロップダウンUI -->
      <div class="relative inline-block text-left">
        <button id="activeStageBadge" onclick="toggleStageDropdown(event)" class="text-xs bg-pink-700 hover:bg-pink-800 transition text-pink-100 font-semibold px-3 py-1.5 rounded-full border border-pink-500 flex items-center gap-1.5 shadow-sm">
          <span id="activeStageText">公演を選択</span>
          <i class="fa-solid fa-chevron-down text-[10px]"></i>
        </button>
        <div id="stageDropdown" class="hidden origin-top-right absolute right-0 mt-2 w-56 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none z-50">
          <div class="py-1 max-h-60 overflow-y-auto" id="stageDropdownList">
            <!-- 動的に生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- 検索バー ＆ サジェスト -->
    <div class="max-w-4xl mx-auto mt-3 relative">
      <div class="relative">
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="メンバー名または公演名で検索..." 
               class="w-full pl-9 pr-4 py-2 bg-white text-slate-800 text-sm rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-pink-300">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>
      <div id="searchSuggest" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-72 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4">

    <!-- 通常タブコンテンツ -->
    <div id="mainTabsContainer">
      <!-- Tab 1: カレンダー -->
      <section id="tab-calendar" class="tab-content">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
            <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
              <i class="fa-regular fa-calendar-days text-pink-500"></i> 劇場スケジュール
            </h2>
            <div class="flex items-center gap-2 w-full sm:w-auto">
              <select id="yearSelect" onchange="onDateChange()" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs font-bold rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-pink-500"></select>
              <select id="monthSelect" onchange="onDateChange()" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs font-bold rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-pink-500"></select>
            </div>
          </div>

          <div class="flex flex-wrap gap-1.5 mb-4">
            <button onclick="filterSchedule('ALL', this)" class="filter-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1 rounded-full">全スケジュール</button>
            <button onclick="filterSchedule('AKB48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">AKB48劇場</button>
          </div>
          
          <div id="calendarList" class="space-y-3"></div>
        </div>
      </section>

      <!-- Tab 2: 一覧表（ポジション一覧） -->
      <section id="tab-positions" class="tab-content hidden space-y-4">
        <div id="positionReadyArea" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-3">
            <div>
              <h2 id="posStageTitle" class="text-lg font-bold text-slate-800">公演名</h2>
              <p id="posGroupTitle" class="text-xs text-pink-600 font-semibold">AKB48</p>
            </div>
            <span id="fixedCountBadge" class="bg-pink-100 text-pink-700 text-xs font-bold px-2.5 py-1 rounded-full">8名枠</span>
          </div>

          <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ポジション一覧（初日メンバー ＆ アンダー）</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse min-w-[400px]">
              <thead>
                <tr class="bg-slate-100 border-b border-slate-200 text-slate-600 text-xs">
                  <th class="p-2.5 w-14 text-center">Pos</th>
                  <th class="p-2.5 w-32">初日メンバー</th>
                  <th class="p-2.5">アンダーメンバー</th>
                </tr>
              </thead>
              <tbody id="positionTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Tab 3: 新設・日別表 -->
      <section id="tab-stage-daily" class="tab-content hidden space-y-4">
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
            <i class="fa-solid fa-table-cells text-pink-500"></i> 日別 ポジション割り当て表
          </h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse min-w-max">
              <thead>
                <tr id="dailyTableHeader" class="bg-slate-100 border-b border-slate-200">
                  <!-- JSで動的生成 -->
                </tr>
              </thead>
              <tbody id="dailyTableBody" class="divide-y divide-slate-100">
                <!-- JSで動的生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <!-- メンバー詳細コンテンツ -->
    <section id="memberDetailContainer" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="avatar-box bg-pink-600 text-white text-base font-bold shadow">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <h2 id="detailMemberName" class="text-xl font-bold text-slate-800">メンバー名</h2>
            <p class="text-xs text-pink-600 font-semibold">出演データ統計</p>
          </div>
        </div>
        <button onclick="goHome()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold border border-slate-200">
          <i class="fa-solid fa-xmark mr-1"></i> 閉じる
        </button>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between border-b pb-2 mb-3">
          <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-pink-500"></i> 出演統計
          </h3>
          <span id="totalPerfBadge" class="bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full">総出演回数: 0回</span>
        </div>
        <h4 class="text-xs font-bold text-slate-500 mb-2">演目ごとの出演回数（初日等も合算）</h4>
        <ul id="showsBreakdownList" class="space-y-1.5 text-xs"></ul>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-800 border-b pb-2 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-pink-500"></i> 出演公演履歴
        </h3>
        <div id="memberShowsHistoryList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
    
    <!-- カレンダー（ホーム）表示時のナビ -->
    <div id="navNormal" class="max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn active flex-1 py-3 text-center text-xs font-semibold text-pink-600">
        <i class="fa-regular fa-calendar-days text-base block mb-0.5"></i> カレンダー
      </button>
    </div>

    <!-- ⑤ 検索・公演選択時のナビ（一覧表 / 日別表） -->
    <div id="navStageDetail" class="hidden max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('positions')" id="nav-positions" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-users-rectangle text-base block mb-0.5"></i> 一覧表
      </button>
      <button onclick="switchTab('stage-daily')" id="nav-stage-daily" class="nav-btn-stage flex-1 py-3 text-center text-xs font-semibold text-slate-400 transition hover:bg-pink-50">
        <i class="fa-solid fa-table-cells text-base block mb-0.5"></i> 日別表
      </button>
    </div>

    <!-- メンバー詳細選択時のナビ -->
    <div id="navMemberSearching" class="hidden max-w-4xl mx-auto flex justify-center py-3 bg-pink-50 text-pink-600 font-bold text-sm items-center gap-2 border-t-2 border-pink-500">
      <i class="fa-solid fa-user-gear"></i>
      <span>メンバー詳細表示中</span>
      <button onclick="goHome()" class="text-xs bg-pink-600 text-white px-3 py-1 rounded ml-2 shadow-sm">戻る</button>
    </div>
  </nav>

  <!-- JavaScript Logic -->
  <script>
    // --- グローバル状態 ---
    let SCHEDULE_DATA = [];
    let STAGE_DATABASE = {};
    let currentStageKey = null;
    let currentScheduleFilter = "ALL";
    let selectedMemberName = null;

    // --- ユーザー提供のデータ (JSON未取得時のマスターデータとして利用) ---
    const FALLBACK_SCHEDULE_2026 = [
      {
        "id": "akb_260807",
        "date": "2026-08-07 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演 初日",
        "members": ["新井彩永", "久保姫菜乃", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛", "山﨑空"],
        "positions": ["新井彩永", "久保姫菜乃", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛", "山﨑空"]
      },
      {
        "id": "akb_260826",
        "date": "2026-08-26 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演",
        "members": ["秋山由奈", "奥本カイリ", "下尾みう", "成田香姫奈", "福岡聖菜", "正鋳真優", "近藤沙樹", "田中沙友利"],
        "positions": ["福岡聖菜", "秋山由奈", "成田香姫奈", "奥本カイリ", "田中沙友利", "正鋳真優", "下尾みう", "近藤沙樹"]
      },
      {
        "id": "akb_260831",
        "date": "2026-08-31 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演",
        "note": "伊藤百花 → 山内瑞葵",
        "members": ["太田有紀", "工藤華純", "黒須遥香", "迫由芽実", "佐藤綺星", "成田香姫奈", "福岡聖菜", "山内瑞葵"],
        "positions": ["福岡聖菜", "佐藤綺星", "成田香姫奈", "迫由芽実", "太田有紀", "山内瑞葵", "黒須遥香", "工藤華純"]
      },
      {
        "id": "akb_260910",
        "date": "2026-09-10 18:30",
        "theater": "AKB48劇場",
        "title": "「夢のポップスター」公演",
        "note": "山﨑空 → 工藤華純",
        "members": ["新井彩永", "久保姫菜乃", "工藤華純", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛"],
        "positions": ["新井彩永", "久保姫菜乃", "倉野尾成美", "坂川陽香", "髙橋彩音", "山内瑞葵", "山口結愛", "工藤華純"]
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initYearMonthDropdowns();
      onDateChange();

      // サジェストボックス・ドロップダウン外クリック時の非表示処理
      document.addEventListener('click', (e) => {
        const suggestBox = document.getElementById('searchSuggest');
        const searchInput = document.getElementById('searchInput');
        if (!suggestBox.contains(e.target) && e.target !== searchInput) suggestBox.classList.add('hidden');

        const stageDropdown = document.getElementById('stageDropdown');
        const stageBadge = document.getElementById('activeStageBadge');
        if (stageDropdown && !stageDropdown.classList.contains('hidden') && !stageBadge.contains(e.target)) {
          stageDropdown.classList.add('hidden');
        }
      });
    });

    function initYearMonthDropdowns() {
      const yearSelect = document.getElementById("yearSelect");
      const monthSelect = document.getElementById("monthSelect");
      yearSelect.innerHTML = ''; monthSelect.innerHTML = '';
      for (let y = 2026; y >= 2005; y--) yearSelect.appendChild(new Option(`${y}年`, y));
      for (let m = 1; m <= 12; m++) monthSelect.appendChild(new Option(`${m}月`, m < 10 ? `0${m}` : `${m}`));
      
      yearSelect.value = "2026";
      monthSelect.value = "08"; // テストデータに合わせて8月に初期設定
    }

    // ①＆② 公演名の正規化
    function normalizeScheduleData(rawData) {
      return rawData.map(item => {
        let rawDateStr = item.date || "";
        let datePart = "", timePart = item.time || "";

        if (rawDateStr.includes(" ")) {
          const parts = rawDateStr.split(" ");
          datePart = parts[0].replace(/-/g, "/");
          timePart = timePart || parts[1];
        } else {
          datePart = rawDateStr.replace(/-/g, "/");
        }

        let rawTitle = item.title || item.stage || "";
        let displayTitle = rawTitle; // 例: "「夢のポップスター」公演 初日"
        // 集計・ベース用: 括弧や「公演〜」を削る → "夢のポップスター"
        let baseStage = rawTitle.replace(/「|」|『|』/g, '').replace(/公演.*$/, '').trim();

        let membersArr = [];
        let performersStr = "";
        if (Array.isArray(item.members)) {
          membersArr = item.members;
          performersStr = item.members.join("・");
        } else if (item.performersText) {
          performersStr = item.performersText;
          membersArr = item.performersText.split("・");
        }

        return {
          id: item.id || "",
          date: datePart,
          time: timePart,
          theater: item.theater || "AKB48劇場",
          displayTitle: displayTitle,
          baseStageName: baseStage,
          performersText: performersStr,
          membersArray: membersArr,
          positionsArray: item.positions || []
        };
      });
    }

    // ③ 動的ポジションデータ構築
    function generateStageDatabase() {
      STAGE_DATABASE = {};
      
      SCHEDULE_DATA.forEach(item => {
        const base = item.baseStageName;
        if (!base) return;

        if (!STAGE_DATABASE[base]) {
          STAGE_DATABASE[base] = {
            id: base,
            name: `「${base}」公演`,
            group: item.theater.replace("劇場", "").trim() || "AKB48",
            fixed: [],
            allMembers: new Set(),
            underChain: {},
            schedules: []
          };
        }
        STAGE_DATABASE[base].schedules.push(item);
        item.membersArray.forEach(m => { if(m) STAGE_DATABASE[base].allMembers.add(m.trim()); });
      });

      // 各ステージの初日（最も古いデータ）を基準にポジション構築
      Object.keys(STAGE_DATABASE).forEach(key => {
        const stage = STAGE_DATABASE[key];
        // 日付順にソート
        stage.schedules.sort((a, b) => (a.date + " " + a.time).localeCompare(b.date + " " + b.time));

        // ポジション配列を持つ最初の公演を「初日固定枠」とする
        const firstShow = stage.schedules.find(s => s.positionsArray && s.positionsArray.length > 0);
        
        if (firstShow) {
          stage.fixed = [...firstShow.positionsArray];
          stage.fixed.forEach(m => { stage.underChain[m] = new Set(); });

          // 以降の公演で初日と異なるメンバーがいればアンダーとして追加
          stage.schedules.forEach(show => {
            if (show.positionsArray) {
              show.positionsArray.forEach((member, idx) => {
                if (idx < stage.fixed.length) {
                  const fixedMember = stage.fixed[idx];
                  if (member && member !== fixedMember && stage.underChain[fixedMember]) {
                    stage.underChain[fixedMember].add(member);
                  }
                }
              });
            }
          });
          // Set を Array に戻す
          Object.keys(stage.underChain).forEach(k => { stage.underChain[k] = Array.from(stage.underChain[k]); });
        }
        stage.allMembers = Array.from(stage.allMembers);
      });
    }

    function onDateChange() {
      // 実際はfetchしますが、今回はFALLBACK_SCHEDULEを利用
      SCHEDULE_DATA = normalizeScheduleData(FALLBACK_SCHEDULE_2026);
      generateStageDatabase();
      renderCalendar();
    }

    // --- UI コントロール系 ---
    
    function goHome() {
      selectedMemberName = null;
      document.getElementById('mainTabsContainer').classList.remove('hidden');
      document.getElementById('memberDetailContainer').classList.add('hidden');
      
      document.getElementById('navNormal').classList.remove('hidden');
      document.getElementById('navStageDetail').classList.add('hidden');
      document.getElementById('navMemberSearching').classList.add('hidden');
      
      switchTab('calendar');
    }

    // ⑤ 検索から、またはヘッダーから公演を選択したときの処理
    function selectStage(stageKey) {
      currentStageKey = stageKey;
      const stage = STAGE_DATABASE[stageKey];
      document.getElementById('activeStageText').innerText = stage ? stage.name : stageKey;
      
      document.getElementById('mainTabsContainer').classList.remove('hidden');
      document.getElementById('memberDetailContainer').classList.add('hidden');

      // 下部タブを「一覧表」「日別表」に切り替え
      document.getElementById('navNormal').classList.add('hidden');
      document.getElementById('navMemberSearching').classList.add('hidden');
      document.getElementById('navStageDetail').classList.remove('hidden');
      document.getElementById('navStageDetail').classList.add('flex');

      renderPositions();
      renderDailyTable();
      switchTab('positions'); // デフォルトは一覧表を表示
    }

    // ⑥ ドロップダウンのトグル
    function toggleStageDropdown(e) {
      if (e) e.stopPropagation();
      const dropdown = document.getElementById('stageDropdown');
      dropdown.classList.toggle('hidden');
      
      if (!dropdown.classList.contains('hidden')) {
        const list = document.getElementById('stageDropdownList');
        list.innerHTML = '';
        Object.keys(STAGE_DATABASE).forEach(key => {
          const li = document.createElement('li');
          li.className = "px-4 py-2.5 hover:bg-pink-50 cursor-pointer flex items-center justify-between border-b border-slate-100 last:border-0";
          li.innerHTML = `<span class="font-bold text-slate-700">${STAGE_DATABASE[key].name}</span>`;
          li.onclick = () => {
            selectStage(key);
            dropdown.classList.add('hidden');
          };
          list.appendChild(li);
        });
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn, .nav-btn-stage').forEach(btn => {
        btn.classList.remove('text-pink-600', 'border-t-[3px]', 'border-pink-500');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-pink-600');
        if (activeBtn.classList.contains('nav-btn-stage')) {
          activeBtn.classList.add('border-t-[3px]', 'border-pink-500');
        }
      }
    }

    // --- レンダリング処理 ---
    
    function renderCalendar() {
      const listContainer = document.getElementById('calendarList');
      listContainer.innerHTML = '';

      const year = document.getElementById("yearSelect").value;
      const month = document.getElementById("monthSelect").value;
      const datePrefix = `${year}/${month}`;

      let filtered = SCHEDULE_DATA.filter(item => {
        const matchesDate = item.date ? item.date.startsWith(datePrefix) : true;
        if (!matchesDate) return false;
        if (currentScheduleFilter === 'ALL') return true;
        return item.theater && item.theater.includes(currentScheduleFilter);
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6 bg-slate-50 rounded-lg border border-slate-200">指定された年月のスケジュールはありません。</p>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "p-3 rounded-lg border shadow-sm bg-white border-slate-200 cursor-pointer hover:border-pink-300 transition";
        card.onclick = () => selectStage(item.baseStageName);
        
        const dateParts = item.date.split('/');
        const monthDay = dateParts.length >= 3 ? `${dateParts[1]}/${dateParts[2]}` : item.date;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="text-center bg-slate-50 border border-slate-200 px-2.5 py-1 rounded w-16">
                <span class="block text-xs text-slate-500 font-bold">${monthDay}</span>
                <span class="block text-xs font-bold text-pink-600">${item.time}</span>
              </div>
              <div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-pink-100 text-pink-700">${item.theater}</span>
                <!-- ハードコードを廃止し、displayTitleを表示 -->
                <h4 class="font-bold text-slate-800 text-xs mt-0.5">${item.displayTitle}</h4>
              </div>
            </div>
          </div>
          ${item.performersText ? `
          <div class="mt-2 pt-2 border-t border-slate-100 text-[11px] bg-slate-50/50 p-2 rounded">
            <span class="font-bold text-slate-700 block mb-0.5">【出演】</span>
            <p class="text-slate-600 leading-relaxed">${item.performersText}</p>
          </div>` : ''}
        `;
        listContainer.appendChild(card);
      });
    }

    // ③ 一覧表 (旧ポジションタブ) の動的レンダリング
    function renderPositions() {
      const stage = STAGE_DATABASE[currentStageKey];
      if (!stage) return;

      document.getElementById('posStageTitle').innerText = stage.name;
      document.getElementById('posGroupTitle').innerText = stage.group;
      document.getElementById('fixedCountBadge').innerText = `${stage.fixed.length}名枠`;

      const tbody = document.getElementById('positionTableBody');
      tbody.innerHTML = '';

      if (stage.fixed.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400">ポジションデータが未登録です</td></tr>';
        return;
      }

      stage.fixed.forEach((fixedName, idx) => {
        const unders = stage.underChain[fixedName] || [];
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 border-b border-slate-100";

        let underHTML = '<span class="text-slate-400 text-xs">なし</span>';
        if (unders.length > 0) {
          underHTML = `<div class="flex flex-wrap items-center gap-3 py-1">` + unders.map(uName => `
            <div class="inline-flex flex-col items-center gap-0.5 text-center cursor-pointer" onclick="openMemberDetail('${uName}')">
              <span class="font-bold text-slate-700 bg-amber-50 border border-amber-100 px-2 py-0.5 rounded text-[11px]">${uName}</span>
            </div>
          `).join('') + `</div>`;
        }

        tr.innerHTML = `
          <td class="p-2 text-center align-middle">
            <span class="avatar-box bg-pink-100 text-pink-700 border border-pink-300 mx-auto font-bold text-xs w-6 h-6">${idx + 1}</span>
          </td>
          <td class="p-2 align-middle">
            <div class="inline-flex flex-col items-start cursor-pointer" onclick="openMemberDetail('${fixedName}')">
              <span class="font-bold text-pink-700 text-sm border-b border-pink-200">${fixedName}</span>
            </div>
          </td>
          <td class="p-2 align-middle">${underHTML}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ⑤ 新設・日別表の動的レンダリング
    function renderDailyTable() {
      const stage = STAGE_DATABASE[currentStageKey];
      const headerTr = document.getElementById('dailyTableHeader');
      const tbody = document.getElementById('dailyTableBody');
      
      headerTr.innerHTML = '<th class="p-2.5 min-w-[100px] sticky left-0 bg-slate-100 z-10 border-r border-slate-200">初日枠</th>';
      tbody.innerHTML = '';

      if (!stage || stage.fixed.length === 0) {
        tbody.innerHTML = '<tr><td class="p-3 text-center text-slate-400">データがありません。</td></tr>';
        return;
      }

      // ポジション配列を持つ公演日程のみを抽出
      const validShows = stage.schedules.filter(s => s.positionsArray && s.positionsArray.length > 0);
      
      validShows.forEach(show => {
        const dateStr = show.date.split('/').slice(1).join('/'); // MM/DD
        const th = document.createElement('th');
        th.className = "p-2.5 min-w-[90px] text-center border-b border-slate-200 whitespace-nowrap";
        th.innerHTML = `<span class="block text-xs font-bold text-slate-600">${dateStr}</span>`;
        headerTr.appendChild(th);
      });

      // 行（ポジション）ごとに生成
      stage.fixed.forEach((fixedMember, idx) => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-slate-100 hover:bg-slate-50";
        
        const tdFixed = document.createElement('td');
        tdFixed.className = "p-2.5 sticky left-0 bg-white z-10 border-r border-slate-200 font-bold text-xs text-slate-800 cursor-pointer hover:text-pink-600";
        tdFixed.innerText = fixedMember;
        tdFixed.onclick = () => openMemberDetail(fixedMember);
        tr.appendChild(tdFixed);

        validShows.forEach(show => {
          const member = show.positionsArray[idx] || "-";
          const isUnder = member !== fixedMember && member !== "-";
          
          const td = document.createElement('td');
          td.className = "p-2 text-center text-xs";
          
          if (isUnder) {
            td.innerHTML = `<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded font-bold whitespace-nowrap block cursor-pointer" onclick="openMemberDetail('${member}')">${member}</span>`;
          } else {
            td.innerHTML = `<span class="text-slate-500 whitespace-nowrap block">${member === fixedMember ? '●' : member}</span>`; // 初日と同じなら●等の記号にしてもスッキリします
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    // --- 検索機能 ---
    function onSearchInput(val) {
      const suggestBox = document.getElementById('searchSuggest');
      if (!val.trim()) { suggestBox.classList.add('hidden'); return; }
      
      const query = val.trim().toLowerCase();
      let matches = [];

      Object.keys(STAGE_DATABASE).forEach(key => {
        const stage = STAGE_DATABASE[key];
        if (stage.name.toLowerCase().includes(query) || stage.id.toLowerCase().includes(query)) {
          matches.push({ type: 'stage', label: stage.name, key: key });
        }
      });

      const allKnownMembers = new Set();
      Object.values(STAGE_DATABASE).forEach(s => s.allMembers.forEach(m => allKnownMembers.add(m)));
      
      allKnownMembers.forEach(name => {
        if (name.toLowerCase().includes(query)) {
          matches.push({ type: 'member', label: name, name: name });
        }
      });

      if (matches.length === 0) { suggestBox.classList.add('hidden'); return; }

      suggestBox.innerHTML = '';
      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = "p-3 hover:bg-pink-50 cursor-pointer flex justify-between items-center";
        div.innerHTML = `
          <span class="font-bold text-slate-800">${m.label}</span>
          <span class="text-[10px] font-bold px-2 py-1 rounded ${m.type === 'stage' ? 'bg-pink-100 text-pink-700' : 'bg-slate-100 text-slate-600'}">
            ${m.type === 'stage' ? '公演' : 'メンバー'}
          </span>`;
        div.onclick = () => {
          suggestBox.classList.add('hidden');
          document.getElementById('searchInput').value = '';
          if (m.type === 'member') openMemberDetail(m.name);
          else if (m.type === 'stage') selectStage(m.key);
        };
        suggestBox.appendChild(div);
      });
      suggestBox.classList.remove('hidden');
    }

    // --- メンバー詳細 ---
    function openMemberDetail(memberName) {
      selectedMemberName = memberName;
      document.getElementById('detailMemberName').innerText = memberName;

      document.getElementById('mainTabsContainer').classList.add('hidden');
      document.getElementById('memberDetailContainer').classList.remove('hidden');
      
      document.getElementById('navNormal').classList.add('hidden');
      document.getElementById('navStageDetail').classList.add('hidden');
      document.getElementById('navMemberSearching').classList.remove('hidden');

      renderMemberDetailView();
    }

    function renderMemberDetailView() {
      const memberShows = SCHEDULE_DATA.filter(item => item.membersArray.includes(selectedMemberName));
      document.getElementById('totalPerfBadge').innerText = `総出演回数: ${memberShows.length}回`;

      // ④ baseStageName (例: "夢のポップスター") で集計
      const showCountsMap = {};
      memberShows.forEach(item => {
        const baseName = item.baseStageName; 
        showCountsMap[baseName] = (showCountsMap[baseName] || 0) + 1;
      });

      const breakdownList = document.getElementById('showsBreakdownList');
      breakdownList.innerHTML = '';
      Object.entries(showCountsMap).forEach(([title, count]) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-200";
        li.innerHTML = `<span class="font-bold text-slate-700 cursor-pointer hover:text-pink-600 hover:underline" onclick="selectStage('${title}')">「${title}」公演</span> <span class="bg-pink-100 text-pink-700 font-bold px-2 py-0.5 rounded">${count}回</span>`;
        breakdownList.appendChild(li);
      });

      const historyList = document.getElementById('memberShowsHistoryList');
      historyList.innerHTML = '';
      memberShows.forEach(item => {
        let positionName = '';
        const stageInfo = STAGE_DATABASE[item.baseStageName];
        if (stageInfo && item.positionsArray) {
          const idx = item.positionsArray.indexOf(selectedMemberName);
          if (idx !== -1 && stageInfo.fixed[idx]) {
            positionName = `${stageInfo.fixed[idx]}ポジ`;
          }
        }

        const div = document.createElement('div');
        div.className = "p-2 bg-slate-50 border border-slate-200 rounded text-xs flex justify-between items-center";
        div.innerHTML = `
          <div>
            <span class="font-bold text-pink-600">${item.date}</span>
            <span class="font-bold text-slate-800 ml-1 cursor-pointer hover:underline" onclick="selectStage('${item.baseStageName}')">${item.displayTitle}</span>
          </div>
          ${positionName ? `<span class="bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded text-[10px]">${positionName}</span>` : ''}
        `;
        historyList.appendChild(div);
      });
    }

    function filterSchedule(filter, btn) {
      currentScheduleFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-slate-800', 'text-white');
        b.classList.add('bg-slate-200', 'text-slate-700');
      });
      btn.classList.remove('bg-slate-200', 'text-slate-700');
      btn.classList.add('bg-slate-800', 'text-white');
      renderCalendar();
    }
  </script>
</body>
